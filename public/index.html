    }
    if (amHost()) body += `<button class="btn ghost" id="wend">${t('endGame')}</button>`;
    return `${playerChips(w.turnId)}<section class="stage" aria-live="polite">${body}</section>`;
  }

  // ---------- Ticking bomb: one phone, passed around the table ----------
  const BOMB_LEN = { short: [10, 25], normal: [20, 45], long: [35, 75] };
  let bombTimer = null;
  function bombStop() { clearInterval(bombTimer); bombTimer = null; }
  function bombNextCat(b) {
    if (!b.deck || !b.deck.length) b.deck = Engine_shuffle(CONTENT.bomb.map((_, i) => i));
    b.cat = b.deck.pop();
  }
  function Engine_shuffle(a) { for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
  function bombStart() {
    const b = ui.bomb, [lo, hi] = BOMB_LEN[b.len] || BOMB_LEN.normal;
    bombNextCat(b);
    b.stage = 'play'; b.start = Date.now(); b.endAt = b.start + (lo + Math.random() * (hi - lo)) * 1000; b.nextTick = 0;
    bombStop();
    bombTimer = setInterval(() => {
      const now = Date.now(), f = Math.min(1, (now - b.start) / (b.endAt - b.start));
      const el = document.querySelector('.bomb'); if (el) el.style.setProperty('--speed', (0.9 - f * 0.75).toFixed(2) + 's');
      if (now >= b.nextTick) { Sound.tick(); b.nextTick = now + 700 - f * 580; }
      if (now >= b.endAt) {
        bombStop(); b.stage = 'boom';
        b.loser = b.players.length ? b.players[b.holder % b.players.length] : null;
        if (b.loser) b.tally[b.loser] = (b.tally[b.loser] || 0) + 1;
        Sound.boom(); if (navigator.vibrate) { try { navigator.vibrate([300, 80, 300]); } catch (e) {} }
        render();
      }
    }, 100);
    render();
  }
  function renderBomb() {
    const b = ui.bomb, names = b.players;
    let html = `<div class="topbar"><div class="wordmark">💣 ${t('g_bomb')}</div><div class="tools">${toolButtons()}<button class="btn ghost" id="bombquit">${t('back')}</button></div></div>`;
    if (b.stage === 'setup') {
      html += `<div class="panel">
          <h2>${t('bombNames')}</h2>
          <div class="name-chips">${names.map((n, i) => `<span class="name-chip">${esc(n)}<button data-bombdel="${i}" aria-label="✕">✕</button></span>`).join('')}</div>
          <div class="row" style="margin-top:8px"><input id="bombname" maxlength="16" placeholder="${t('namePh')}"><button class="btn" id="bombadd" style="flex:.5">${t('addName')}</button></div>
        </div>
        <div class="panel" style="margin-top:12px"><div class="setting"><span class="label">${t('bombLen')}</span>${['short', 'normal', 'long'].map(() => '').join('')}
          <div class="seg" role="group">${['short', 'normal', 'long'].map((v) => `<button data-bomblen="${v}" aria-pressed="${b.len === v}">${t(v)}</button>`).join('')}</div></div></div>
        <button class="btn primary block big" id="bombgo" style="margin-top:16px">${t('bombStart')}</button>`;
    } else if (b.stage === 'play') {
      const holder = names.length ? names[b.holder % names.length] : null, next = names.length ? names[(b.holder + 1) % names.length] : null;
      html += `<section class="stage bomb-stage">
          <div class="say-card"><div class="say-q" style="text-align:center">${esc(CONTENT.bomb[b.cat][L()])}</div></div>
          <div class="bomb" style="--speed:.9s">💣</div>
          ${holder ? `<div class="pull-result">${esc(t('holding', { name: holder }))}</div>` : ''}
          <button class="btn primary block big pass-btn" id="bombpass">${next ? esc(t('pass', { name: next })) : t('passPlain')}</button>
          <button class="btn ghost" id="bombcat">${t('otherCat')}</button>
        </section>`;
    } else {
      const tally = Object.entries(b.tally).sort((x, y) => y[1] - x[1]);
      html += `<section class="stage boom-stage">
          <div class="boom-burst">💥</div>
          <div class="boom-title">${t('boomBang')}</div>
          <div class="pull-result">${b.loser ? esc(t('boomDrinks', { name: b.loser })) : t('boomNoName')}</div>
          <div class="grid2" style="margin-top:12px"><button class="btn big" id="bombquit2">${t('stop')}</button><button class="btn primary big" id="bombagain">${t('againRound')}</button></div>
          ${tally.length ? `<div class="bets"><b style="text-align:center">${t('tallyTitle')}</b>${tally.map(([n, c]) => `<div class="bet-row"><span>${esc(n)}</span><b>💥 ${c}</b></div>`).join('')}</div>` : ''}
        </section>`;
    }
    app.innerHTML = html;
    const on = (id, fn) => { const el = document.getElementById(id); if (el) el.onclick = fn; };
    const quit = () => { bombStop(); ui.bomb = null; render(); };
    on('bombquit', quit); on('bombquit2', quit);
    const addName = () => {
      const el = document.getElementById('bombname'), n = Engine.cleanName(el.value);
      if (n && !b.players.includes(n) && b.players.length < 16) { b.players.push(n); store.set('bussen:bombPlayers', b.players); }
      render(); const el2 = document.getElementById('bombname'); if (el2) el2.focus();
    };
    on('bombadd', addName);
    const bn = document.getElementById('bombname'); if (bn) bn.onkeydown = (e) => { if (e.key === 'Enter') addName(); };
    app.querySelectorAll('[data-bombdel]').forEach((x) => x.onclick = () => { b.players.splice(+x.dataset.bombdel, 1); store.set('bussen:bombPlayers', b.players); render(); });
    app.querySelectorAll('[data-bomblen]').forEach((x) => x.onclick = () => { b.len = x.dataset.bomblen; store.set('bussen:bombLen', b.len); render(); });
    on('bombgo', () => { b.holder = 0; b.tally = {}; bombStart(); });
    on('bombpass', () => { b.holder++; Sound.pass(); render(); });
    on('bombcat', () => { bombNextCat(b); render(); });
    on('bombagain', () => { if (b.loser) b.holder = Math.max(0, b.players.indexOf(b.loser)); bombStart(); });
  }

  function renderBlackjack() {
    const j = S.play, me = S.me.id, stack = j.stacks[me] || 0, myHand = j.hands[me], myRes = j.results[me];
    const fresh = j.n !== seen.jn; seen.jn = j.n;
    const revealKey = j.round + ':' + j.n, dealerFlip = j.stage === 'result' && seen.jr !== revealKey; if (j.stage === 'result') seen.jr = revealKey;
    const pill = (total, cards, extra = '') => {
      const cls = total > 21 ? 'bust' : (cards && cards.length === 2 && total === 21) ? 'bj' : '';
      return `<span class="total-pill ${cls} ${extra}">${total > 21 ? '💥 ' + total : total}</span>`;
    };
    // Dealer: cards fanned out, the hole card flips over at the end
    const dealerCards = j.dealer.map((c, i) => (i === 1 && dealerFlip ? flipCard(c, 'bj-card', true) : card(c, 'bj-card ' + (fresh && j.stage === 'turns' ? 'deal' : '')))).join('');
    const dealer = j.dealer.length
      ? `<div class="bj-zone"><div class="bj-who">${t('dealer')} ${j.stage === 'result' ? pill(j.dealerTotal, j.dealer) : `<span class="total-pill">${j.dealerTotal}</span>`}</div><div class="fan-row">${dealerCards}</div></div>`
      : `<div class="bj-zone"><div class="bj-who">${t('dealer')}</div><div class="fan-row">${card(null, 'bj-card')}${card(null, 'bj-card')}</div></div>`;
    // Other players as seats around the table
    const seats = S.players.filter((p) => p.id !== me).map((p) => {
      const h = j.hands[p.id], r = j.results[p.id], bet = h ? h.bet : j.bets[p.id];
      const state = r ? ({ win: 'won', bj: 'won', push: 'push', lose: 'lost', bust: 'lost' }[r.outcome]) : '';
      return `<div class="seat ${p.id === j.turnId ? 'turn' : ''} ${state}">
        <div class="seat-av">${esc(p.name.slice(0, 1).toUpperCase())}${p.bot ? '<i>🤖</i>' : ''}</div>
        <div class="seat-nm">${esc(p.name)}</div>
        <div class="seat-info">${h ? pill(h.total, h.cards, 'sm') : bet ? `<span class="mini-chip">${bet}</span>` : `<span class="muted">${t('betting')}</span>`}</div>
        <div class="seat-stack">🪙 ${j.stacks[p.id]}</div>
      </div>`;
    }).join('');
    // Me: big hand plus my betting circle
    const myBet = myHand ? myHand.bet : (j.bets[me] || ui.bjStake || 0);
    const meCards = myHand ? myHand.cards.map((c, i) => card(c, 'bj-card big ' + (fresh && i >= myHand.cards.length - (j.stage === 'turns' && myHand.cards.length > 2 ? 1 : 2) ? 'deal' : ''))).join('') : '';
    let banner2 = '';
    if (j.stage === 'result' && myRes) {
      const good = myRes.outcome === 'win' || myRes.outcome === 'bj';
      if (dealerFlip) setTimeout(() => (good ? Sound.win() : myRes.outcome === 'push' ? null : Sound.lose()), 450);
      const txt = myRes.outcome === 'bj' ? t('bjWin', { n: myRes.amount }) : myRes.outcome === 'win' ? t('youWin', { n: myRes.amount })
        : myRes.outcome === 'push' ? t('push') : t(myRes.outcome === 'bust' ? 'youBust' : 'youLose', { n: myHand ? myHand.bet : 0 });
      banner2 = `<div class="bj-banner ${good ? 'good' : myRes.outcome === 'push' ? '' : 'bad'}" style="animation-delay:.5s">${esc(txt)}</div>`;
    } else if (j.stage === 'turns') {
      banner2 = j.turnId === me ? '' : `<div class="bj-banner soft">${esc(t('theirTurn', { name: nameOf(j.turnId) }))}</div>`;
    }
    const mine = `<div class="bj-zone me">
        ${myHand ? `<div class="fan-row">${meCards}</div><div class="bj-who">${t('you')} ${pill(myHand.total, myHand.cards)}</div>` : ''}
        <div class="bet-spot ${myBet ? 'has' : ''}">${myBet ? `<span class="chip-stack">${myBet}${myHand && myHand.doubled ? '<em>×2</em>' : ''}</span>` : `<span>${t('betHere')}</span>`}</div>
      </div>`;
    const table = `<div class="bj-table">
        ${dealer}
        ${banner2}
        ${seats ? `<div class="seats">${seats}</div>` : ''}
        ${mine}
      </div>`;
    // Controls under the table, like the action bar of a blackjack app
    let controls = '';
    if (j.stage === 'bet' && !j.bets[me]) {
      const stake = Math.min(ui.bjStake || 0, stack);
      const chipVals = [1, 2, 5, 10].filter((v) => v <= stack);
      controls = `<div class="chip-tray">${chipVals.map((v) => `<button class="poker-chip c${v}" data-jchip="${v}" aria-label="+${v}">${v}</button>`).join('')}
          <button class="poker-chip call" data-jchip="all" aria-label="${t('allIn')}">${t('allIn')}</button></div>
        <div class="bj-bar">
          <button class="btn" id="jclear" ${stake ? '' : 'disabled'}>${t('clear')}</button>
          ${!stake && ui.bjLast && ui.bjLast <= stack ? `<button class="btn" id="jrebet">${t('rebet', { n: ui.bjLast })}</button>` : ''}
          <button class="btn primary big" id="jbet" ${stake ? '' : 'disabled'}>${stake ? t('placeBet', { n: stake }) : t('tapChips')}</button>
        </div>`;
    } else if (j.stage === 'bet') {
      controls = `<p class="status-line">${t('waitingOthers')} · ${t('betsIn', { n: S.players.filter((p) => j.bets[p.id]).length, total: S.players.length })}</p>`;
    } else if (j.stage === 'turns' && j.turnId === me) {
      const canDouble = myHand && myHand.cards.length === 2 && stack >= myHand.bet * 2;
      controls = `<div class="bj-actions">
          <button class="act-btn hit" id="jhit"><span>＋</span>${t('hit')}</button>
          <button class="act-btn stand" id="jstand"><span>✋</span>${t('stand')}</button>
          <button class="act-btn dbl" id="jdouble" ${canDouble ? '' : 'disabled'}><span>×2</span>${t('double')}</button>
        </div>`;
    } else if (j.stage === 'turns') controls = hostSkipButton(j.turnId);
    if (j.stage === 'result') {
      if (myRes && myRes.broke) controls += `<p class="status-line bad-txt">${t('brokeNote', { n: S.settings.startSips || 10 })}</p>`;
      controls += amHost() ? `<div class="bj-bar"><button class="btn big" id="jend">${t('endGame')}</button><button class="btn primary big" id="jnext">${t('nextRound')}</button></div>`
        : `<p class="status-line">${t('waitingHost')}</p>`;
    }
    const canGive = (j.stage === 'result' || (j.stage === 'bet' && !j.bets[me])) && stack > 1;
    if (canGive) {
      if (!ui.jGiveOpen) controls += `<button class="btn ghost" id="jgiveopen">🎁 ${t('giveSips')}</button>`;
      else {
        const max = Math.min(stack - 1, 10), amt = Math.min(ui.jGiveAmt || 1, max);
        controls += `<div class="split pop"><div class="split-head">🎁 ${t('giveSips')}</div>
          <div class="seg amount" role="group">${Array.from({ length: max }, (_, i) => `<button data-jgamt="${i + 1}" aria-pressed="${amt === i + 1}">${i + 1}</button>`).join('')}</div>
          <div class="targets">${S.players.filter((p) => p.id !== me).map((p) => `<button class="btn big" data-jgive="${p.id}">${esc(p.name)}</button>`).join('')}</div>
          <button class="btn ghost" id="jgiveclose">${t('cancel')}</button></div>`;
      }
    }
    return `<div class="bj-head"><div class="balance ${fresh ? 'pop' : ''}"><b>🪙 ${stack}</b><span>${t('yourStack')}</span></div><div class="muted small">${t('roundN', { n: j.round })}</div></div>
      ${table}<div class="bj-controls">${controls}</div>`;
  }

  // ---------- renderers ----------
  function card(c, cls = '', badge = '') {
    const b = badge ? `<span class="badge">${badge}</span>` : '';
    if (!c) return `<div class="card back ${cls}" aria-label="${t('faceDown')}">${b}</div>`;
    const red = c.s === 'hearts' || c.s === 'diamonds';
    return `<div class="card ${red ? 'red' : ''} ${cls}" aria-label="${rk(c.r)} of ${c.s}"><span class="rk">${rk(c.r)}</span><span class="st">${SUIT[c.s]}</span>${b}</div>`;
  }
  const cardText = (c) => `${rk(c.r)}${SUIT[c.s]}`;
  // A card that turns over from its back to its face.

    if (!animate) return card(c, cls);

      <div class="panel" style="margin-top:12px">
        <div class="setting"><span class="label">${t('playFor')}</span>${seg('unit', [['sips', t('sips')], ['points', t('points')]], s.unit, ed)}</div>
        ${S.gameType === 'mlt' ? `<div class="setting"><span class="label">${t('sipsSetting')}</span>${seg('mltSips', [[1, '1'], [2, '2'], [3, '3']], s.mltSips || 1, ed)}</div>` : ''}
        ${S.gameType === 'nhie' ? `<div class="setting"><span class="label">${t('nhieCat')}</span>${seg('nhieCat', [['mild', t('mild')], ['spicy', t('spicy')], ['mix', t('mix')]], s.nhieCat || 'mild', ed)}</div>
          <div class="setting"><span class="label">${t('sipsSetting')}</span>${seg('nhieSips', [[1, '1'], [2, '2'], [3, '3']], s.nhieSips || 1, ed)}</div>` : ''}
        ${S.gameType === 'imposter' ? `<div class="setting stacked"><span class="label">${t('impCat')}</span><div class="cat-grid">${[['mix', '🎲'], ['food', '🍕'], ['animals', '🐶'], ['places', '📍'], ['jobs', '👩‍🍳'], ['things', '☂️'], ['pop', '🎬'], ['custom', '✍️']].map(([v, ic]) =>
            `<button ${ed ? '' : 'disabled'} data-set="impCat" data-val='"${v}"' aria-pressed="${(s.impCat || 'mix') === v}"><span>${ic}</span>${t('cat_' + v)}</button>`).join('')}</div></div>
          ${(s.impCat || 'mix') === 'custom' ? `<div class="custom-words">
            ${ed ? `<textarea id="customwords" rows="4" placeholder="${t('customPh')}">${esc(ui.customDraft != null ? ui.customDraft : (s.impCustom || []).join('\n'))}</textarea>
              <button class="btn primary block" id="customsave">${t('customSave')}</button>` : ''}
            <p class="status-line">${(s.impCustom || []).length >= 2 ? t('customCount', { n: (s.impCustom || []).length }) : t('customNeed')}</p>
          </div>` : ''}
          <div class="setting"><span class="label">${t('impCount')}</span>${seg('impCount', [[1, '1'], [2, '2']], s.impCount || 1, ed)}</div>
          <div class="setting"><span class="label">${t('impHint')}</span>${seg('impHint', [[true, t('on')], [false, t('off')]], s.impHint !== false, ed)}</div>
          <div class="setting"><span class="label">${t('impSips')}</span>${seg('impSips', [[1, '1'], [2, '2'], [3, '3']], s.impSips || 2, ed)}</div>` : ''}
        ${S.gameType === 'blackjack' ? `<div class="setting"><span class="label">${t('startSips')}</span>${seg('startSips', [[5, '5'], [10, '10'], [20, '20']], s.startSips || 10, ed)}</div>` : ''}
        ${S.gameType === 'bussen' ? `
        <div class="setting"><span class="label">${t('checkpoints')}</span>${seg('checkpoints', [['off', t('off')], ['half', t('half')], ['pull', t('pullCard')]], s.checkpoints || 'off', ed)}</div>
        <div class="setting"><span class="label">${t('wrongSips')}</span>${seg('wrongSips', [[1, '1'], [2, '2'], [3, '3']], s.wrongSips || 1, ed)}</div>
        <div class="setting"><span class="label">${t('discoSips')}</span>${seg('discoSips', [[1, '1'], [2, '2'], [3, '3']], s.discoSips || 1, ed)}</div>
        <div class="setting"><span class="label">${t('treeSize')}</span>${seg('treeSize', [['small', t('small')], ['normal', t('normal')], ['big', t('big')]], s.treeSize || 'normal', ed)}</div>
        <div class="setting"><span class="label">${t('treeValues')}<span class="hint">${{ normal: '1 · 2 · 3', steep: '2 · 3 · 4', double: '2 · 4 · 6' }[s.treeValues || 'normal']}</span></span>${seg('treeValues', [['normal', t('normal')], ['steep', t('steep')], ['double', t('x2')]], s.treeValues || 'normal', ed)}</div>
        <div class="setting"><span class="label">${t('tie')}</span>${seg('tie', [['total', t('tieTotal')], ['drawoff', t('tieDraw')], ['all', t('tieAll')]], s.tie || 'total', ed)}</div>` : ''}
      </div>
      <div style="margin-top:16px">
        ${ed ? `<button class="btn primary block big" id="start" ${S.players.length < 2 ? 'disabled' : ''}>${t('start')}</button>
                ${S.players.length < 2 ? `<p class="status-line">${t('addBotHint')}</p>` : ''}`
             : `<p class="status-line">${esc(t('waitingFor', { name: nameOf(S.hostId) }))}</p>`}
        ${ui.loadingNote ? `<p class="status-line">${esc(ui.loadingNote)}</p>` : ''}
      </div>`;
    app.querySelectorAll('[data-set]').forEach((b) => b.onclick = () => act('settings', { patch: { [b.dataset.set]: JSON.parse(b.dataset.val) } }));
    app.querySelectorAll('[data-remove]').forEach((b) => b.onclick = () => act('remove', { id: b.dataset.remove }));
    const on = (id, fn) => { const el = document.getElementById(id); if (el) el.onclick = fn; };
    on('start', () => act('start'));
    on('addbot', () => act('addBot'));
    app.querySelectorAll('[data-setgame]').forEach((b) => b.onclick = () => act('setGame', { game: b.dataset.setgame }));
    const cw = document.getElementById('customwords');
    if (cw) {
      cw.oninput = () => { ui.customDraft = cw.value; };
      cw.onfocus = () => { ui.customFocus = true; }; cw.onblur = () => { ui.customFocus = false; };
      if (ui.customFocus) { cw.focus(); cw.setSelectionRange(cw.value.length, cw.value.length); }
    }
    on('customsave', () => {
      const words = (ui.customDraft != null ? ui.customDraft : (cw ? cw.value : '')).split(/[\n,]/);
      if (act('settings', { patch: { impCustom: words } })) { ui.customDraft = null; ui.customFocus = false; }
    });
    on('leave', leave);
  }

  function playerChips(activeId) {
    const html = `<div class="players">${S.players.map((p) => {
      const leaders = S.players.filter((o) => o.partner === p.id).map((o) => o.name);
      const total = p.drank + p.atjes * 100;
      const bump = prevDrank[p.id] !== undefined && total > prevDrank[p.id];
      return `<div class="chip ${p.id === activeId ? 'active' : ''} ${p.id === S.me.id ? 'me' : ''} ${bump ? 'bump' : ''}">
        <div class="nm">${esc(p.name)}${p.bot ? ' 🤖' : ''}</div>
        <div class="st"><span>🂠 ${p.cardCount}</span><span>${S.settings.unit === 'points' ? '★' : '🍺'} ${p.drank}${p.atjes ? ` · 🍻${p.atjes}` : ''}</span></div>
        ${leaders.length ? `<div class="st">🔗 ${esc(leaders.join(', '))}</div>` : ''}
      </div>`; }).join('')}</div>`;
    S.players.forEach((p) => { prevDrank[p.id] = p.drank + p.atjes * 100; });
    return html;
  }
  function targetButtons(attr) {
    return `<div class="targets">${S.players.filter((p) => p.id !== S.me.id).map((p) =>
      `<button class="btn big" data-${attr}="${p.id}">${esc(p.name)}</button>`).join('')}</div>`;
  }

  function renderQuestions() {
    const q = S.questions, mine = q.activeId === S.me.id, lp = q.lastPull;
    if (lp && lp.n !== seen.pull) { seen.pull = lp.n; ui.revealUntil = Date.now() + REVEAL_MS; ui.revealFresh = true; setTimeout(render, REVEAL_MS + 30); }
    const revealing = lp && Date.now() < ui.revealUntil;
    const active = S.players.find((p) => p.id === q.activeId);
    let body = '';
    if (revealing) {
      body += `<div class="pull">${flipCard(lp.card, 'lg', ui.revealFresh)}
        <span class="verdict pop ${lp.correct ? 'good' : 'bad'}">${esc(nameOf(lp.playerId))} ${lp.correct ? '✓' : '✗'}</span></div>`;
      ui.revealFresh = false;
    } else {
      body += `<div class="pull">${card(null, 'lg ' + (mine && !q.pendingPartner ? 'waiting' : ''))}</div>`;
    }
    if (q.pendingPartner) {
      if (q.pendingPartner.from === S.me.id) body += banner(t('duoPick'), true) + targetButtons('partner');
      else body += banner(esc(t('duoOther', { name: nameOf(q.pendingPartner.from) })));
    } else if (mine) {
      body += banner(t('yourTurn'), true) + `<div class="prompt">${t('q' + q.round)}</div>`;
      const dis = revealing ? 'disabled' : '';
      if (q.round === 1) body += `<div class="grid2"><button class="btn red big" data-guess="red" ${dis}>${t('red')}</button><button class="btn black big" data-guess="black" ${dis}>${t('black')}</button></div>`;
      else if (q.round === 4) body += `<div class="finals">
          <button class="btn" data-guess="new" ${dis}><b>${t('notYet')}</b></button>
          <button class="btn" data-guess="have" ${dis}><b>${t('haveIt')}</b></button>
          <button class="btn" data-guess="disco" ${dis}><b>🪩 ${t('disco')}</b></button>
          <button class="btn" data-guess="duo" ${dis}><b>🔗 ${t('duo')}</b></button>
        </div>`;
      else body += `<div class="grid2">${q.options.map((o) => `<button class="btn primary big" data-guess="${o}" ${dis}>${t(o)}</button>`).join('')}</div>`;
    } else {
      body += banner(esc(t('theirTurn', { name: active.name }))) + `<div class="prompt small-prompt">${t('q' + q.round)}</div>`;
      if (q.activeCards.length) body += `<div class="cards-row">${q.activeCards.map((c) => card(c, 'sm')).join('')}</div>`;
    }
    const pendingFrom = q.pendingPartner ? S.players.find((p) => p.id === q.pendingPartner.from) : active;
    if (amHost() && pendingFrom && pendingFrom.id !== S.me.id && !pendingFrom.bot) body += `<button class="btn ghost" id="skip" style="margin-top:10px">${esc(t('skip', { name: pendingFrom.name }))}</button>`;
    return `${playerChips(q.activeId)}
      <section class="stage" aria-live="polite">
        <div class="steps" aria-label="${t('roundOf', { n: q.round })}">${[1, 2, 3, 4].map((i) => `<span class="${i <= q.round ? 'on' : ''}"></span>`).join('')}</div>
        ${body}
      </section>`;
  }

  function matchIndexes() {
    const py = S.pyramid; if (!py.flipped) return [];
    const r = py.slots[py.flipped - 1].card.r;
    return S.hand.map((c, i) => (c.r === r ? i : -1)).filter((i) => i >= 0);
  }

  function renderSplit(cur) {
    const others = S.players.filter((p) => p.id !== S.me.id);
    const picks = ui.pick, n = picks.length;
    const need = cur.atje ? n : cur.worth * n;
    const given = Object.values(ui.split).reduce((a, b) => a + b, 0), left = need - given;
    const what = cur.atje ? t('atjeN', { n: left }) : unit(left);
    return `<div class="split pop">
      <div class="split-head">${picks.map((i) => cardText(S.hand[i])).join(' ')} · ${left ? t('handOut', { what }) : t('ready')}</div>
      <div class="split-list">${others.map((p) => `
        <button class="split-btn ${ui.split[p.id] ? 'on' : ''}" data-add="${p.id}" ${left ? '' : 'disabled'}>
          <span>${esc(p.name)}</span><b>${ui.split[p.id] ? (cur.atje ? '🍻'.repeat(ui.split[p.id]) : ui.split[p.id]) : ''}</b></button>`).join('')}</div>
      <div class="row" style="margin-top:10px">
        <button class="btn" id="reset">${t('reset')}</button>
        <button class="btn primary" id="give" ${left ? 'disabled' : ''}>${t('give')}</button>
      </div>
      <button class="btn ghost" id="cancel">${t('cancel')}</button></div>`;
  }

  function renderPyramid() {
    const py = S.pyramid, cur = py.flipped > 0 ? py.slots[py.flipped - 1] : null;
    const fresh = py.flipped !== seen.flipped; seen.flipped = py.flipped;
    const intro = treeIntro !== S.code + ':tree'; treeIntro = S.code + ':tree';
    const order = ['top', 'r2', 'r3', 'r4', 'trunk'];
    let k = 0;
    const tree = order.map((row) => {
      const cells = py.slots.map((x, i) => ({ ...x, i })).filter((x) => x.row === row);
      return `<div class="tree-row ${row}">${cells.map((x) => {
        // Double cards lie sideways; the others stand upright. Every card shows its sips.
        const badge = x.atje ? 'atje' : String(x.worth);
        const shape = x.double ? ' side' : '';
        const isCur = x.i === py.flipped - 1;
        const delay = intro ? ` style="animation-delay:${(k++) * 60}ms"` : '';
        let inner;
        if (isCur && fresh) inner = flipCard(x.card, 'hot' + shape, true);
        else inner = card(x.card, (x.card ? '' : x.atje ? 'gold' : 'pine') + (isCur ? ' hot' : '') + shape, badge);
        return `<div class="slot ${intro ? 'grow' : ''}"${delay}>${inner}${isCur && fresh && badge ? `<span class="badge slot-badge">${badge}</span>` : ''}</div>`;
      }).join('')}</div>`;
    }).join('');
    let body = '';
    const matches = matchIndexes();
    if (ui.pick !== null && (!Array.isArray(ui.pick) || ui.pick.some((i) => !matches.includes(i)))) { ui.pick = null; ui.split = {}; }
    if (!cur) body = banner(amHost() ? t('flipWhenReady') : t('waitFirst'));
    else {
      body = `<div class="worth-line ${fresh ? 'pop' : ''}">${rk(cur.card.r)} = ${cur.atje ? t('atjeBang') : unit(cur.worth)}</div>`;
      if (ui.pick !== null) body += renderSplit(cur);
      else if (matches.length) body += `<button class="btn primary block big pop" id="layall">${t('layDown', { cards: matches.map((i) => cardText(S.hand[i])).join(' ') })}</button>`;
      if (py.claims.length) body += `<ul class="claims">${py.claims.map((c) =>
        `<li class="slide-in">${c.cards.map((x) => card(x, 'xs')).join('')}<span class="txt"><b>${esc(nameOf(c.from))}</b> → ${Object.entries(c.split).map(([id, n]) =>
          `${esc(nameOf(id))} ${c.atje ? '🍻'.repeat(n) : n}`).join(', ')}</span></li>`).join('')}</ul>`;
    }
    let ctl = '';
    if (amHost() && ui.pick === null) ctl = py.flipped < py.total
      ? `<button class="btn ${matches.length ? '' : 'primary'} block big" id="flip" style="margin-top:12px">${py.flipped ? t('nextCard') : t('flipFirst')}</button>`
      : `<button class="btn primary block big" id="finish" style="margin-top:12px">${t('toBus')}</button>`;
    return `${playerChips(null)}
      <section class="stage" aria-live="polite">
        <div class="tree" aria-label="${t('treeLabel', { n: py.flipped, total: py.total })}">${tree}</div>
        ${body}${ctl}
      </section>`;
  }

  const PULL_MS = 2200;
  // The cards pulled at the start of the bus, with what each one decided.
  function pullRows(b) {
    const rows = [];
    if (b.pickedCard) rows.push({ key: 'len', icon: '🚌', label: t('busLength'), c: b.pickedCard, result: t('nCards', { n: b.length }) });
    if (b.upCard) rows.push({ key: 'up', icon: '👁', label: t('faceUp'), c: b.upCard, result: t('upDown', { up: b.upCount, down: b.length - b.upCount }) });
    if (b.cpCard) rows.push({ key: 'cp', icon: '🚩', label: t('checkpoint'), c: b.cpCard, result: b.checkpoints.length ? t('afterCard', { n: b.checkpoints[0] }) : t('none') });
    else if (b.stage === 'ride' && S.settings.checkpoints === 'half' && b.checkpoints.length) rows.push({ key: 'half', icon: '🚩', label: t('checkpoint'), c: null, result: t('afterCard', { n: b.checkpoints[0] }) });
    return rows;
  }
  function pullSummary(rows) {
    if (!rows.length) return '';
    return `<div class="pulls">${rows.map((r) => `<div class="pull-row"><span class="pi">${r.icon}</span>${r.c ? card(r.c, 'xs') : '<span class="pi-gap"></span>'}<span class="pl">${r.label}</span><b>${r.result}</b></div>`).join('')}</div>`;
  }

  function renderBus() {
    const b = S.bus, driver = b.riderId === S.me.id, lr = b.lastResult;
    const top = banner(driver ? t('youBus') : esc(t('theyBus', { name: nameOf(b.riderId) })), driver);
    const rows = pullRows(b);
    const pulled = rows.filter((r) => r.c).length;
    if (b.stage === 'pick') ui.pullSeen = 0;
    if (pulled > (ui.pullSeen || 0)) { ui.pullSeen = pulled; ui.pullRevealUntil = Date.now() + PULL_MS; ui.pullFresh = true; setTimeout(render, PULL_MS + 30); }
    // Just pulled: show that card big, turning over, with what it means.
    if (pulled && Date.now() < (ui.pullRevealUntil || 0)) {
      const last = rows.filter((r) => r.c).pop();
      const html = `${playerChips(b.riderId)}
        <section class="stage" aria-live="polite">
          ${top}
          <div class="prompt">${last.icon} ${last.label}</div>
          <div class="pull">${flipCard(last.c, 'lg', ui.pullFresh)}</div>
          <div class="pull-result pop" style="animation-delay:.45s">${last.result}</div>
          ${pullSummary(rows.filter((r) => r !== last))}
        </section>`;
      ui.pullFresh = false;
      return html;
    }
    const picker = (count, attr, prompt, waiting, hint) => {
      const backs = Array.from({ length: count }, (_, i) => driver
        ? `<button class="card back pick-card deal" style="animation-delay:${i * 70}ms" data-${attr}="${i}" aria-label="${t('cardN', { n: i + 1 })}"></button>`
        : card(null, 'deal')).join('');
      return `${playerChips(b.riderId)}
        <section class="stage" aria-live="polite">
          ${top}
          ${pullSummary(rows)}
          <div class="prompt">${driver ? prompt : waiting}</div>
          <div class="bus">${backs}</div>
          ${hint ? `<p class="status-line">${hint}</p>` : ''}
        </section>`;
    };
    if (b.stage === 'pick') return picker(b.choiceCount, 'pickbus', t('pullLen'), t('pullingLen'), t('lenHint'));
    if (b.stage === 'pickup') return picker(b.upChoiceCount, 'pickup', t('pullUp'), t('pullingUp'), '');
    if (b.stage === 'pickcp') return picker(b.cpChoiceCount, 'pickcp', t('pullCp'), t('pullingCp'), '');
    if (lr && lr.n !== seen.bus) { seen.bus = lr.n; ui.busRevealUntil = Date.now() + REVEAL_MS; ui.busFresh = true; setTimeout(render, REVEAL_MS + 30); }
    const revealing = lr && Date.now() < ui.busRevealUntil;
    const cps = new Set(b.checkpoints || []);
    const cells = b.positions.map((c, i) => {
      const cls = i === b.pos ? 'hot' : i < b.pos ? 'ahead' : '';
      return card(c, cls, cps.has(i) ? '🚩' : '');
    }).join('');
    let res;
    if (revealing) { res = `<div class="pull">${flipCard(lr.card, 'lg', ui.busFresh)}<span class="verdict pop ${lr.correct ? 'good' : 'bad'}">${lr.correct ? '✓' : '✗'}</span></div>`; ui.busFresh = false; }
    else res = `<div class="pull">${card(null, 'lg ' + (driver ? 'waiting' : ''))}</div>`;
    return `${playerChips(b.riderId)}
      <section class="stage" aria-live="polite">
        ${top}
        ${pullSummary(rows)}
        <div class="worth-line">${b.pos}/${b.length} <span class="muted small">${t('tryN', { n: b.attempts })}</span></div>
        ${(b.queue || []).length ? `<p class="status-line" style="margin-top:-6px">${esc(t('nextUp', { names: b.queue.map(nameOf).join(', ') }))}</p>` : ''}
        <div class="bus">${cells}</div>${res}
        ${driver ? (b.curUp
          ? `<div class="grid2"><button class="btn primary big" data-bus="higher" ${revealing ? 'disabled' : ''}>${t('higher')}</button><button class="btn primary big" data-bus="lower" ${revealing ? 'disabled' : ''}>${t('lower')}</button></div>`
          : `<div class="grid2"><button class="btn red big" data-bus="red" ${revealing ? 'disabled' : ''}>${t('red')}</button><button class="btn black big" data-bus="black" ${revealing ? 'disabled' : ''}>${t('black')}</button></div>`) : ''}
      </section>`;
  }

  function renderTiebreak() {
    const tb = S.tiebreak, canDraw = tb.tied.includes(S.me.id) && !tb.draws[S.me.id] && !tb.loserId;
    seen.tie = seen.tie || {};
    const cells = tb.tied.map((id) => {
      const c = tb.draws[id], key = S.code + ':' + tb.round + ':' + id, fresh = c && !seen.tie[key];
      if (c) seen.tie[key] = 1;
      return `<div class="tie-cell ${tb.loserId === id ? 'loser' : ''}">${c ? flipCard(c, 'mid', fresh) : card(null, 'mid ' + (id === S.me.id && canDraw ? 'waiting' : ''))}<span>${esc(nameOf(id))}</span></div>`;
    }).join('');
    let foot = '';
    if (tb.loserId) {
      foot = `<div class="pull-result pop" style="animation-delay:.5s">${esc(t('goesBus', { name: nameOf(tb.loserId) }))}</div>`
        + (amHost() ? `<button class="btn primary block big" id="tiecont">${t('toBus')}</button>` : `<p class="status-line">${t('waitingHost')}</p>`);
    } else if (canDraw) foot = `<button class="btn primary block big pop" id="drawtie">${t('drawCard')}</button>`;
    return `${playerChips(null)}
      <section class="stage" aria-live="polite">
        ${banner(t('tieTitle'), canDraw)}
        ${tb.round > 1 && !tb.loserId ? `<p class="status-line">${t('tieRound')}</p>` : ''}
        <div class="tie-row">${cells}</div>
        ${foot}
      </section>`;
  }

  function renderEnded() {
    const e = S.ended, ranked = [...S.players].sort((a, b) => (b.drank + b.atjes * 10) - (a.drank + a.atjes * 10));
    return `<section class="stage">
        ${S.gameType !== 'bussen' ? `<div class="wordmark" style="font-size:2.2rem;margin:6px 0">${gameIcon(S.gameType)} ${t('g_' + S.gameType)}</div>
          <p class="pull-result">${esc(t('roundsPlayed', { n: e.rounds || 1 }))}</p>
          ${S.gameType === 'blackjack' && e.stacks ? `<div class="pulls">${S.players.map((p) => `<div class="pull-row"><span class="pi">🪙</span><span class="pl">${esc(p.name)}</span><b>${e.stacks[p.id] || 0}</b></div>`).join('')}</div>` : ''}`
        : `<div class="wordmark" style="font-size:2.6rem;margin:6px 0">${t('offBus')}</div>
        ${(e.results || []).length > 1
          ? `<div class="pulls">${e.results.map((r) => `<div class="pull-row"><span class="pi">🚌</span><span class="pl">${esc(nameOf(r.riderId))}</span><b>${t('tries', { n: r.attempts })}</b></div>`).join('')}</div>`
          : `<p class="muted">${esc(nameOf(e.riderId))} · ${t('tries', { n: e.attempts })}</p>`}`}
        <ul class="plist" style="text-align:left;margin-top:10px">
          ${ranked.map((p) => `<li><span style="flex:1">${esc(p.name)}${p.bot ? ' 🤖' : ''}</span><b>${S.settings.unit === 'points' ? '★' : '🍺'} ${p.drank}${p.atjes ? ` · 🍻${p.atjes}` : ''}</b></li>`).join('')}
        </ul>
        ${amHost() ? `<button class="btn primary block big" id="again" style="margin-top:16px">${t('playAgain')}</button>` : ''}
      </section>`;
  }

  function renderClosed() {
    app.innerHTML = `<div class="home-hero"><div class="wordmark" style="font-size:3rem">${t('gameOver')}</div>
      <p class="tagline">${t('hostClosed')}</p></div><button class="btn primary block big" id="home">${t('back')}</button>`;
    document.getElementById('home').onclick = () => { leaveLocal(); render(); };
  }

  let lastTurnKey = '';
  function buzzOnTurn() {
    let key = '';
    if (S.phase === 'questions') {
      const q = S.questions;
      if ((q.pendingPartner && q.pendingPartner.from === S.me.id) || (!q.pendingPartner && q.activeId === S.me.id)) key = 'q' + q.round + (q.pendingPartner ? 'p' : '');
    } else if (S.phase === 'pyramid' && matchIndexes().length) key = 'p' + S.pyramid.flipped;
    else if (S.phase === 'bus' && S.bus.riderId === S.me.id) key = 'bus';
    else if (S.phase === 'tiebreak' && S.tiebreak.tied.includes(S.me.id) && !S.tiebreak.draws[S.me.id]) key = 'tie' + S.tiebreak.round;
    else if (S.phase === 'play' && S.gameType === 'nhie' && ((S.play.stage === 'pick' && S.play.turnId === S.me.id) || (S.play.stage === 'answer' && S.play.mine === undefined))) key = 'n' + S.play.n;
    else if (S.phase === 'play' && S.gameType === 'imposter' && ((S.play.stage === 'reveal' && !S.play.ready.includes(S.me.id)) || (S.play.stage === 'vote' && !S.play.myVote))) key = 'i' + S.play.round + S.play.stage;
    else if (S.phase === 'play' && S.gameType === 'mlt' && ((S.play.stage === 'pick' && S.play.turnId === S.me.id) || (S.play.stage === 'vote' && !S.play.myVote))) key = 'w' + S.play.n;
    else if (S.phase === 'play' && S.gameType === 'blackjack' && (S.play.turnId === S.me.id || (S.play.stage === 'bet' && !S.play.bets[S.me.id]))) key = 'j' + S.play.round + S.play.stage;
    if (key && key !== lastTurnKey && navigator.vibrate) { try { navigator.vibrate(60); } catch (e) {} }
    lastTurnKey = key;
  }

  function renderGame() {
    const stage = S.phase === 'play' ? (S.gameType === 'nhie' ? renderNhie() : S.gameType === 'imposter' ? renderImposter() : S.gameType === 'mlt' ? renderMlt() : renderBlackjack())
      : S.phase === 'questions' ? renderQuestions() : S.phase === 'pyramid' ? renderPyramid() : S.phase === 'tiebreak' ? renderTiebreak() : S.phase === 'bus' ? renderBus() : renderEnded();
    const last = S.log[S.log.length - 1];
    const matches = S.phase === 'pyramid' ? matchIndexes() : [];
    app.innerHTML = `
      <div class="topbar"><div class="wordmark">${gameIcon(S.gameType)} ${t('g_' + S.gameType)}</div><div class="tools"><span class="meta">${db ? `<b>${S.code}</b>` : t('solo')}</span>${toolButtons()}</div></div>
      ${stage}
      ${ui.loadingNote ? `<p class="status-line">${esc(ui.loadingNote)}</p>` : ''}
      ${last ? `<button class="ticker ${last.kind}" id="hist" aria-expanded="${ui.history}">${esc(logText(last))}</button>` : ''}
      ${ui.history ? `<ul class="feed">${[...S.log].reverse().slice(1, 15).map((l) => `<li class="${l.kind}">${esc(logText(l))}</li>`).join('')}</ul>` : ''}
      <div style="text-align:center;margin-top:8px"><button class="btn ghost" id="leave">${leaveLabel(amHost() ? t('closeGame') : t('leave'))}</button></div>
      ${(S.phase === 'questions' || S.phase === 'pyramid') && ui.pick === null ? `
      <div class="hand"><div class="hand-inner"><div class="cards">${S.hand.length ? S.hand.map((c, i) => matches.includes(i)
          ? `<button class="card ${c.s === 'hearts' || c.s === 'diamonds' ? 'red' : ''} match" id="${i === matches[0] ? 'laycard' : ''}" data-layall="1" aria-label="${t('layDown', { cards: cardText(c) })}"><span class="rk">${rk(c.r)}</span><span class="st">${SUIT[c.s]}</span></button>`
          : card(c, i >= prevHand ? 'deal' : '')).join('') : `<span class="muted small">${t('noCards')}</span>`}</div></div></div>` : ''}`;
    prevHand = S.hand.length;
    const all = (sel, fn) => app.querySelectorAll(sel).forEach((b) => b.onclick = () => fn(b));
    all('[data-guess]', (b) => act('guess', { choice: b.dataset.guess }));
    all('[data-partner]', (b) => act('partner', { to: b.dataset.partner }));
    all('[data-bus]', (b) => act('busGuess', { choice: b.dataset.bus }));
    all('[data-pickbus]', (b) => act('pickBus', { index: +b.dataset.pickbus }));
    all('[data-pickcp]', (b) => act('pickCheckpoint', { index: +b.dataset.pickcp }));
    all('[data-pickup]', (b) => act('pickFaceUp', { index: +b.dataset.pickup }));
    const layAll = () => { ui.pick = matchIndexes(); ui.split = {}; render(); };
    all('[data-layall]', layAll);
    all('[data-add]', (b) => { ui.split[b.dataset.add] = (ui.split[b.dataset.add] || 0) + 1; render(); });
    const on = (id, fn) => { const el = document.getElementById(id); if (el) el.onclick = fn; };
    on('layall', layAll);
    on('give', () => { if (act('claim', { cardIndexes: ui.pick, split: ui.split })) { ui.pick = null; ui.split = {}; render(); } });
    on('reset', () => { ui.split = {}; render(); });
    on('cancel', () => { ui.pick = null; ui.split = {}; render(); });
    on('flip', () => { ui.pick = null; ui.split = {}; act('flip'); });
    on('finish', () => act('finishPyramid'));
    on('again', () => act('newGame'));
    on('skip', () => act('skip'));
    on('hist', () => { ui.history = !ui.history; render(); });
    on('drawtie', () => act('drawTie'));
    // Never have I ever
    on('nrandom', () => act('nRandom'));
    const nown = document.getElementById('nown');
    if (nown) {
      nown.oninput = () => { ui.nOwn = nown.value; };
      nown.onfocus = () => { ui.nOwnFocus = true; }; nown.onblur = () => { ui.nOwnFocus = false; };
      if (ui.nOwnFocus) { nown.focus(); nown.setSelectionRange(nown.value.length, nown.value.length); }
    }
    on('nownbtn', () => { if ((ui.nOwn || '').trim() && act('nOwn', { text: ui.nOwn })) { ui.nOwn = ''; ui.nOwnFocus = false; } });
    on('nhave', () => act('nAnswer', { have: true }));
    on('nnot', () => act('nAnswer', { have: false }));
    on('nnext', () => act('nNext'));
    on('nend', () => act('nEnd'));
    // Who's most likely to
    on('wrandom', () => act('wRandom'));
    const wown = document.getElementById('wown');
    if (wown) {
      wown.oninput = () => { ui.wOwn = wown.value; };
      wown.onfocus = () => { ui.wOwnFocus = true; }; wown.onblur = () => { ui.wOwnFocus = false; };
      if (ui.wOwnFocus) { wown.focus(); wown.setSelectionRange(wown.value.length, wown.value.length); }
    }
    on('wownbtn', () => { if ((ui.wOwn || '').trim() && act('wOwn', { text: ui.wOwn })) { ui.wOwn = ''; ui.wOwnFocus = false; } });
    all('[data-wvote]', (b) => act('wVote', { to: b.dataset.wvote }));
    on('wnext', () => act('wNext'));
    on('wend', () => act('wEnd'));
    // Imposter
    on('rolecard', () => { ui.impShow = !ui.impShow; if (ui.impShow) ui.impSeen = true; render(); });
    on('iready', () => { act('iReady'); ui.impShow = false; });
    on('itovote', () => { ui.impShow = false; act('iToVote'); });
    all('[data-ivote]', (b) => act('iCast', { to: b.dataset.ivote }));
    on('inext', () => { ui.impSeen = false; act('iNext'); });
    on('iend', () => act('iEnd'));
    // Blackjack
    all('[data-jchip]', (b) => {
      Sound.chip();
      const stack0 = S.play.stacks[S.me.id] || 0;
      ui.bjStake = b.dataset.jchip === 'all' ? stack0 : Math.min(stack0, (ui.bjStake || 0) + +b.dataset.jchip);
      render();
    });
    on('jclear', () => { ui.bjStake = 0; render(); });
    on('jrebet', () => { ui.bjStake = ui.bjLast; render(); });
    on('jbet', () => {
      const amount = Math.min(ui.bjStake || 0, S.play.stacks[S.me.id] || 0);
      if (amount && act('jBet', { amount })) { ui.bjLast = amount; ui.bjStake = 0; }
    });
    on('jhit', () => act('jHit'));
    on('jstand', () => act('jStand'));
    on('jdouble', () => act('jDouble'));
    on('jnext', () => { ui.jGiveOpen = false; act('jNext'); });
    on('jend', () => act('jEnd'));
    on('jgiveopen', () => { ui.jGiveOpen = true; render(); });
    on('jgiveclose', () => { ui.jGiveOpen = false; render(); });
    all('[data-jgamt]', (b) => { ui.jGiveAmt = +b.dataset.jgamt; render(); });
    all('[data-jgive]', (b) => { if (act('jGive', { to: b.dataset.jgive, amount: ui.jGiveAmt || 1 })) { ui.jGiveOpen = false; render(); } });
    on('tiecont', () => act('tieContinue'));
    on('leave', leave);
    buzzOnTurn();
    const sp = document.querySelector('.split');
    if (sp && !ui.splitShown) { ui.splitShown = true; sp.scrollIntoView({ block: 'center', behavior: 'smooth' }); }
    if (!sp) ui.splitShown = false;
  }

  function render() {
    if (ui.bomb) return renderBomb();
    if (!S) return renderHome();
    if (S.phase === 'closed') return renderClosed();
    if (S.phase === 'lobby') return renderLobby();
    renderGame();
  }

  // ---------- full-screen moments ----------
  function smallToast(html, kind) {
    let box = document.getElementById('toasts');
    if (!box) { box = document.createElement('div'); box.id = 'toasts'; box.setAttribute('aria-live', 'polite'); document.body.appendChild(box); }
    const el = document.createElement('div');
    el.className = 'toast ' + (kind || '');
    el.innerHTML = html;
    box.appendChild(el);
    while (box.children.length > 3) box.firstChild.remove();
    setTimeout(() => { el.classList.add('out'); setTimeout(() => el.remove(), 300); }, 2600);
  }
  function showNextToast() {
    while (toasts.length && toasts[0].kind !== 'atje') {
      const tt = toasts.shift();
      if (tt.kind === 'drink') {
        const r = reasonText(tt.reason);
        Sound.gulp();
        smallToast(`<b>${tt.unit === 'points' ? '★' : '🍺'} ${t('unit', { n: tt.amount, points: tt.unit === 'points' })}</b>${r ? `<span>${esc(r)}</span>` : ''}`, 'drink');
        if (navigator.vibrate) { try { navigator.vibrate(60); } catch (e) {} }
      } else if (tt.kind === 'partner') {
        smallToast(`<b>🔗 ${esc(tt.from)}</b><span>${t('partnerToast')}</span>`);
      }
    }
    if (overlay.firstChild || !toasts.length) return;
    const tt = toasts.shift();
    const div = document.createElement('div');
    div.className = 'takeover'; div.setAttribute('role', 'alertdialog');
    const r = reasonText(tt.reason);
    div.innerHTML = `<div class="atje-card"><div class="atje-glass" aria-hidden="true">🍺</div><div class="atje-title">${t('atje')}</div>
      ${r ? `<div class="atje-why">${esc(r)}</div>` : ''}<button class="btn atje-btn">${t('done')}</button></div>`;
    overlay.appendChild(div);
    Sound.boom();
    if (navigator.vibrate) { try { navigator.vibrate([120, 60, 120]); } catch (e) {} }
    div.querySelector('button').onclick = () => { div.remove(); showNextToast(); };
    div.querySelector('button').focus();
  }

  // ---------- start ----------
  document.documentElement.lang = lang;
  render();
  const use = window.claude && typeof window.claude.use === 'function' ? window.claude.use('db') : Promise.resolve(null);
  use.then(async (d) => {
    db = d || null; dbStatus = db ? 'ready' : 'none';
    if (db) await resume();
    if (!S) render();
  }).catch(() => { dbStatus = 'none'; if (!S) render(); });
})();

</script>
</body>
</html>
