<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Proost!</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Proost!">
<meta name="theme-color" content="#24160f">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="apple-touch-icon" href="/icon-192.png">
<link rel="icon" href="/icon-192.png">
<script src="/sync.js"></script>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bowlby+One&family=Instrument+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root {
  --wood: #efe2cc;
  --panel: #e5d3b6;
  --panel-2: #d9c29e;
  --line: #c7ab82;
  --amber: #e89a0c;
  --amber-deep: #b97206;
  --foam: #fffaf0;
  --cherry: #c8102e;
  --ink: #241a14;
  --field: #fbf3e4;
  --text: #2a1a10;
  --muted: #745a43;
  --good: #2f7d32;
  --bad: #c2382a;
  --grain: rgba(80,40,10,.04);
  --glow: #f7ead5;
  --display: "Bowlby One", "Arial Black", Impact, system-ui, sans-serif;
  --body: "Instrument Sans", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  color-scheme: light;
  box-sizing: border-box;
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --wood: #24160f; --panel: #33221a; --panel-2: #422c20; --line: #5a4031;
    --amber: #f2a51a; --amber-deep: #c97d08; --field: #1a100b;
    --text: #f3e6d2; --muted: #b39b80; --good: #8fcf7a; --bad: #ef6a5a;
    --grain: rgba(255,255,255,.012); --glow: #3b2617;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --wood: #24160f; --panel: #33221a; --panel-2: #422c20; --line: #5a4031;
  --amber: #f2a51a; --amber-deep: #c97d08; --field: #1a100b;
  --text: #f3e6d2; --muted: #b39b80; --good: #8fcf7a; --bad: #ef6a5a;
  --grain: rgba(255,255,255,.012); --glow: #3b2617;
  color-scheme: dark;
}
html { scroll-padding-top: env(safe-area-inset-top, 0px); }
* { box-sizing: border-box; }
html, body { margin: 0; min-height: 100%; }
body {
  background: var(--wood);
  background-image:
    repeating-linear-gradient(92deg, var(--grain) 0 2px, transparent 2px 9px),
    radial-gradient(120% 60% at 50% -10%, var(--glow) 0%, transparent 70%);
  color: var(--text);
  font: 16px/1.45 var(--body);
  -webkit-font-smoothing: antialiased;
}
button { font: inherit; color: inherit; cursor: pointer; }
button:disabled { opacity: .45; cursor: default; }
:focus-visible { outline: 3px solid var(--amber); outline-offset: 2px; }
#app { max-width: 520px; margin: 0 auto; padding: 14px 16px 150px; }

/* ---------- type ---------- */
.wordmark { font-family: var(--display); letter-spacing: .01em; line-height: .9; color: var(--amber); }
h2 { font-family: var(--display); font-weight: 400; font-size: 1.5rem; line-height: 1.1; margin: 0 0 .4rem; }
.muted { color: var(--muted); }
.small { font-size: .875rem; }

/* ---------- controls ---------- */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: .4em;
  min-height: 48px; padding: 0 1.1rem; border-radius: 14px; border: 0;
  background: var(--panel-2); font-weight: 600;
  box-shadow: inset 0 -3px 0 rgba(0,0,0,.25);
}
.btn:active:not(:disabled) { transform: translateY(1px); box-shadow: inset 0 -1px 0 rgba(0,0,0,.25); }
.btn.primary { background: var(--amber); color: #241a14; }
.btn.ghost { background: transparent; box-shadow: none; color: var(--muted); text-decoration: underline; text-underline-offset: 3px; min-height: 40px; }
.btn.block { width: 100%; }
.btn.red { background: var(--cherry); color: #fff; }
.btn.black { background: #241a14; color: #fff; border: 1px solid var(--line); }
.btn.big { min-height: 64px; font-size: 1.15rem; border-radius: 18px; }
input {
  width: 100%; min-height: 52px; padding: 0 14px; border-radius: 14px;
  border: 2px solid var(--line); background: var(--field); color: var(--text); font: 600 1.05rem var(--body);
}
input:focus { border-color: var(--amber); outline: none; }
.code-input { text-transform: uppercase; letter-spacing: .3em; font-family: var(--display); font-weight: 400; text-align: center; }
.row { display: flex; gap: 10px; }
.row > * { flex: 1; }
.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.panel { background: var(--panel); border-radius: 18px; padding: 16px; }
.stack > * + * { margin-top: 12px; }
.seg { display: inline-flex; background: var(--field); border-radius: 12px; padding: 3px; }
.seg button { border: 0; background: transparent; padding: 7px 12px; border-radius: 9px; font-weight: 600; color: var(--muted); }
.seg button[aria-pressed="true"] { background: var(--panel-2); color: var(--text); }
.setting { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 10px 0; border-top: 1px solid var(--line); }
.setting:first-of-type { border-top: 0; }
.setting .label { font-weight: 600; }
.setting .hint { display: block; font-weight: 400; font-size: .8rem; color: var(--muted); }

/* ---------- cards ---------- */
.card {
  --w: 54px;
  position: relative; flex: none;
  width: var(--w); height: calc(var(--w) * 1.4);
  border-radius: calc(var(--w) * .12);
  background: var(--foam); color: var(--ink);
  box-shadow: 0 2px 0 rgba(0,0,0,.25), 0 6px 14px rgba(0,0,0,.25);
  display: grid; place-items: center;
  font-family: var(--display);
}
.card.red { color: var(--cherry); }
.card { color: #241a14; }
.card .rk { position: absolute; top: 6%; left: 9%; font-size: calc(var(--w) * .3); line-height: 1; }
.card .st { font-size: calc(var(--w) * .5); line-height: 1; font-family: var(--body); }
.card.sm { --w: 38px; }
.card.xs { --w: 30px; }
.card.lg { --w: 104px; }
.card.back {
  background:
    repeating-linear-gradient(45deg, var(--amber-deep) 0 4px, var(--amber) 4px 8px);
  border: 3px solid var(--foam);
}
.card.empty { background: transparent; border: 2px dashed var(--line); box-shadow: none; }
.card.hot { outline: 3px solid var(--amber); outline-offset: 3px; }
.card.pick { transform: translateY(-14px); outline: 3px solid var(--amber); outline-offset: 2px; }
button.card { border: 0; padding: 0; transition: transform .15s ease; }
.flip-in { animation: flip .5s cubic-bezier(.2,.8,.3,1.2); }
@keyframes flip {
  0% { transform: perspective(500px) rotateY(90deg) scale(.9); }
  100% { transform: perspective(500px) rotateY(0) scale(1); }
}

/* ---------- home ---------- */
.home-hero { padding: 36px 0 26px; text-align: center; }
.home-hero .wordmark { font-size: clamp(4rem, 22vw, 6.2rem); }
.fan { position: relative; height: 128px; margin: 0 auto 10px; width: 200px; }
.fan .card { position: absolute; left: 50%; bottom: 0; --w: 76px; transform-origin: 50% 120%; }
.fan .card:nth-child(1) { transform: translateX(-50%) rotate(-16deg); }
.fan .card:nth-child(2) { transform: translateX(-50%) rotate(0deg) translateY(-8px); }
.fan .card:nth-child(3) { transform: translateX(-50%) rotate(16deg); }
.tagline { margin: 14px auto 0; max-width: 30ch; color: var(--muted); }
.or { display: flex; align-items: center; gap: 12px; color: var(--muted); font-size: .875rem; margin: 18px 0; }
.or::before, .or::after { content: ""; flex: 1; height: 1px; background: var(--line); }

/* ---------- lobby ---------- */
.room-code { font-family: var(--display); font-size: 3.4rem; letter-spacing: .14em; color: var(--amber); line-height: 1; margin: 4px 0 6px; }
.plist { list-style: none; padding: 0; margin: 0; }
.plist li { display: flex; align-items: center; gap: 10px; padding: 9px 0; border-top: 1px solid var(--line); font-weight: 600; }
.plist li:first-child { border-top: 0; }
.tag { font-size: .72rem; font-weight: 700; padding: 2px 8px; border-radius: 99px; background: var(--panel-2); color: var(--muted); }
.tag.host { background: var(--amber); color: #241a14; }
.dot { width: 9px; height: 9px; border-radius: 50%; background: var(--good); flex: none; }
.dot.off { background: var(--line); }

/* ---------- game ---------- */
.topbar { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; margin-bottom: 12px; }
.topbar .wordmark { font-size: 1.6rem; }
.topbar .meta { color: var(--muted); font-size: .875rem; text-align: right; }
.topbar .meta b { color: var(--text); letter-spacing: .12em; }
.players { display: flex; gap: 8px; overflow-x: auto; padding: 2px 2px 10px; margin: 0 -2px 6px; scrollbar-width: none; }
.players::-webkit-scrollbar { display: none; }
.chip { flex: none; min-width: 88px; padding: 8px 10px; border-radius: 14px; background: var(--panel); border: 2px solid transparent; }
.chip.active { border-color: var(--amber); }
.chip.off { opacity: .5; }
.chip .nm { font-weight: 700; font-size: .9rem; white-space: nowrap; max-width: 110px; overflow: hidden; text-overflow: ellipsis; }
.chip .st { font-size: .78rem; color: var(--muted); display: flex; gap: 8px; }
.stage { background: var(--panel); border-radius: 22px; padding: 18px 16px; text-align: center; }
.stage .prompt { font-family: var(--display); font-size: 1.45rem; line-height: 1.15; margin: 4px 0 14px; }
.who { color: var(--muted); font-weight: 600; }
.cards-row { display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; }
.pull { display: flex; flex-direction: column; align-items: center; gap: 10px; margin: 6px 0 16px; }
.verdict { font-weight: 700; padding: 4px 12px; border-radius: 99px; font-size: .9rem; }
.verdict.good { background: rgba(143,207,122,.16); color: var(--good); }
.verdict.bad { background: rgba(239,106,90,.16); color: var(--bad); }
.steps { display: flex; justify-content: center; gap: 6px; margin-bottom: 8px; }
.steps span { width: 26px; height: 6px; border-radius: 3px; background: var(--line); }
.steps span.on { background: var(--amber); }
.suits { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
.suits .btn { font-size: 1.8rem; min-height: 64px; padding: 0; }
.targets { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; }
.targets .btn[aria-pressed="true"] { background: var(--amber); color: #241a14; }

.pyr { display: flex; flex-direction: column; align-items: center; gap: 6px; margin: 4px 0 14px; }
.pyr-row { display: flex; gap: 6px; align-items: center; }
.pyr .card { --w: 40px; }
.pyr-row .worth { width: 30px; font-size: .78rem; color: var(--muted); font-weight: 700; text-align: left; }
.claims { list-style: none; margin: 14px 0 0; padding: 0; text-align: left; }
.claims li { display: flex; align-items: center; gap: 10px; padding: 10px 0; border-top: 1px solid var(--line); font-size: .92rem; }
.claims li .txt { flex: 1; }
.claims .btn { min-height: 38px; padding: 0 12px; font-size: .88rem; }

.bus { display: flex; gap: 6px; justify-content: center; flex-wrap: wrap; margin: 8px 0 16px; }
.bus .card { --w: 44px; }

.feed { list-style: none; margin: 14px 2px 0; padding: 0; font-size: .86rem; color: var(--muted); }
.feed li { padding: 4px 0; }
.feed li.drink { color: var(--amber); }
.feed li:first-child { color: var(--text); }

/* hand, pinned to the bottom of the screen */
.hand {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 5;
  background: linear-gradient(to top, var(--wood) 70%, transparent);
  padding: 22px 16px calc(12px + env(safe-area-inset-bottom, 0px));
}
.hand-inner { max-width: 520px; margin: 0 auto; }
.hand .lbl { font-size: .8rem; color: var(--muted); margin-bottom: 6px; }
.hand .cards { display: flex; gap: 6px; overflow-x: auto; padding-top: 16px; }
.hand .cards .card { --w: 58px; }

/* takeover + snackbar */
.takeover {
  position: fixed; inset: 0; z-index: 20; display: grid; place-items: center; text-align: center;
  background: var(--amber); color: #241a14; padding: 24px;
  animation: pop .35s cubic-bezier(.2,.9,.3,1.3);
}
.takeover .n { font-family: var(--display); font-size: 9rem; line-height: .85; }
.takeover .w { font-family: var(--display); font-size: 2rem; line-height: 1; }
.takeover .r { margin-top: 10px; font-weight: 600; }
.takeover .actions { margin-top: 26px; display: flex; gap: 10px; justify-content: center; }
.takeover .btn { background: #241a14; color: var(--foam); }
@keyframes pop { from { transform: scale(1.15); opacity: 0; } to { transform: scale(1); opacity: 1; } }
.snack {
  position: fixed; left: 50%; bottom: calc(150px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%);
  z-index: 30; background: var(--text); color: var(--wood); font-weight: 600; padding: 10px 16px; border-radius: 12px;
  max-width: calc(100% - 32px); box-shadow: 0 8px 24px rgba(0,0,0,.4);
}
.status-line { text-align: center; color: var(--muted); font-size: .85rem; margin-top: 8px; }
@media (prefers-reduced-motion: reduce) {
  .flip-in, .takeover { animation: none; }
  button.card { transition: none; }
}

.note { font-size: .85rem; color: var(--muted); background: var(--panel); border-radius: 14px; padding: 10px 14px; margin-top: 14px; }
.bot { font-size: .8em; }
.finals { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.finals .btn { flex-direction: column; align-items: flex-start; justify-content: flex-start; text-align: left; gap: 2px; padding: 12px; min-height: 84px; }
.finals .btn b { font-size: 1rem; }
.finals .btn span { font-size: .78rem; font-weight: 500; color: var(--muted); line-height: 1.25; }
.icon-btn { border: 0; background: transparent; color: var(--muted); font-size: 1.1rem; min-width: 36px; min-height: 36px; border-radius: 10px; }

.turn { display: inline-block; font-weight: 700; padding: 6px 14px; border-radius: 99px; background: var(--panel-2); margin: 4px 0 10px; }
.turn.mine { background: var(--amber); color: #241a14; animation: pulse 1.6s ease-in-out infinite; }
@keyframes pulse { 50% { box-shadow: 0 0 0 6px rgba(242,165,26,.25); } }
.small-prompt { font-size: 1.05rem !important; color: var(--muted); }
.worth-line { font-family: var(--display); font-size: 1.5rem; margin: 6px 0 12px; }
.tree { display: flex; flex-direction: column; align-items: center; gap: 6px; margin: 2px 0 14px; position: relative; }
.tree .star { color: var(--amber); font-size: 1.6rem; line-height: 1; margin-bottom: -2px; }
.tree-row { display: flex; gap: 6px; justify-content: center; }
.tree .card { --w: 42px; }
.tree-row.trunk .card { margin-top: 4px; }
.card.pine { background: repeating-linear-gradient(45deg, #2f6b3a 0 4px, #3d8a4a 4px 8px); border: 3px solid var(--foam); }
.card.gold { background: repeating-linear-gradient(45deg, #d9a521 0 4px, #f2c94c 4px 8px); border: 3px solid var(--foam); }
.card .badge { position: absolute; top: -7px; right: -7px; font: 700 .62rem/1 var(--body); padding: 3px 5px; border-radius: 99px; background: var(--cherry); color: #fff; }
.card.match { outline: 3px solid var(--amber); outline-offset: 2px; animation: pulse 1.6s ease-in-out infinite; }
.split { background: var(--panel-2); border-radius: 18px; padding: 14px; margin-top: 4px; }
.split-head { font-weight: 700; margin-bottom: 10px; }
.split-list { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.split-btn { display: flex; justify-content: space-between; align-items: center; min-height: 56px; padding: 0 14px; border-radius: 14px; border: 2px solid var(--line); background: var(--panel); font-weight: 600; }
.split-btn.on { border-color: var(--amber); }
.split-btn b { font-family: var(--display); font-size: 1.3rem; color: var(--amber); }
.claims li { gap: 10px; }
.chip.me { background: var(--panel-2); }
.ticker { display: block; width: 100%; text-align: left; border: 0; background: transparent; color: var(--muted); font-size: .88rem; padding: 12px 2px 0; }
.ticker.drink { color: var(--amber); }
.ticker::after { content: " ▾"; opacity: .6; }
.ticker[aria-expanded="true"]::after { content: " ▴"; }
@media (prefers-reduced-motion: reduce) { .turn.mine, .card.match { animation: none; } }

/* ---- animations ---- */
.flip3d { position: relative; width: var(--w, 54px); height: calc(var(--w, 54px) * 1.4); perspective: 700px; flex: none; }
.flip3d.lg { --w: 104px; }
.flip3d.hot { --w: 42px; }
.tree .flip3d { --w: 42px; }
.flip-inner { position: absolute; inset: 0; transform-style: preserve-3d; animation: turn .6s cubic-bezier(.3,.7,.3,1.15) both; }
.flip-inner .card { position: absolute; inset: 0; backface-visibility: hidden; -webkit-backface-visibility: hidden; }
.flip-inner .face-back { transform: rotateY(180deg); }
@keyframes turn { from { transform: rotateY(180deg) scale(.92); } to { transform: rotateY(0) scale(1); } }
.card.waiting { animation: hover 2.2s ease-in-out infinite; }
@keyframes hover { 50% { transform: translateY(-5px) rotate(-1.5deg); } }
.deal { animation: deal .45s cubic-bezier(.2,.8,.3,1.2) both; }
@keyframes deal { from { transform: translateY(-60px) rotate(-12deg) scale(.7); opacity: 0; } to { transform: none; opacity: 1; } }
.slot { position: relative; }
.slot .slot-badge { position: absolute; top: -7px; right: -7px; z-index: 2; font: 700 .62rem/1 var(--body); padding: 3px 5px; border-radius: 99px; background: var(--cherry); color: #fff; }
.slot.grow, .star.grow { animation: grow .4s cubic-bezier(.2,.9,.3,1.3) both; }
@keyframes grow { from { transform: scale(0) translateY(20px); opacity: 0; } to { transform: none; opacity: 1; } }
.pop { animation: popin .35s cubic-bezier(.2,.9,.3,1.4) both; }
@keyframes popin { from { transform: scale(.7); opacity: 0; } to { transform: none; opacity: 1; } }
.slide-in { animation: slidein .35s ease-out both; }
@keyframes slidein { from { transform: translateX(-24px); opacity: 0; } to { transform: none; opacity: 1; } }
.chip.bump { animation: bump .6s ease; }
@keyframes bump { 0% { transform: scale(1); } 30% { transform: scale(1.08); background: var(--amber); color: #241a14; } 100% { transform: scale(1); } }
.chip.bump .st { color: inherit; }
.bus .card.hot { animation: popin .35s ease both; }
#toasts { position: fixed; left: 50%; top: calc(10px + env(safe-area-inset-top, 0px)); transform: translateX(-50%); z-index: 25; display: flex; flex-direction: column; gap: 6px; align-items: center; pointer-events: none; width: max-content; max-width: calc(100% - 24px); }
.toast { display: flex; flex-direction: column; align-items: center; gap: 2px; background: var(--text); color: var(--wood); padding: 16px 34px; border-radius: 26px; box-shadow: 0 10px 30px rgba(0,0,0,.4); font-size: 1.2rem; text-align: center; animation: drop .3s cubic-bezier(.2,.9,.3,1.3) both; }
.toast b { font-size: 2.2rem; font-family: var(--display); font-weight: 400; line-height: 1.05; }
.toast.drink { background: var(--amber); color: #241a14; }
.toast span { opacity: .8; font-size: 1rem; font-weight: 600; }
.card.side, .flip3d.side { width: calc(var(--w) * 1.4); height: var(--w); }
.tree-row { align-items: center; }
.bus .card.ahead { opacity: .55; }
.toast.out { animation: rise .3s ease forwards; }
@keyframes drop { from { transform: translateY(-30px); opacity: 0; } to { transform: none; opacity: 1; } }
@keyframes rise { to { transform: translateY(-30px); opacity: 0; } }
.claims li .card + .card { margin-left: -18px; }
@media (prefers-reduced-motion: reduce) {
  .flip-inner, .deal, .slot.grow, .star.grow, .pop, .slide-in, .chip.bump, .card.waiting, .toast, .toast.out, .bus .card.hot { animation: none !important; }
}

.pulls { display: grid; gap: 6px; margin: 2px auto 12px; max-width: 320px; text-align: left; }
.pull-row { display: flex; align-items: center; gap: 10px; background: var(--panel-2); border-radius: 12px; padding: 6px 12px 6px 8px; font-size: .9rem; }
.pull-row .pi { width: 1.4em; text-align: center; }
.pull-row .pi-gap { width: 30px; }
.pull-row .pl { flex: 1; color: var(--muted); }
.pull-row b { font-weight: 700; }
.pull-result { font-family: var(--display); font-size: 1.7rem; margin: -4px 0 14px; }

.tools { display: flex; align-items: center; gap: 2px; }
.tools .meta { margin-right: 6px; }
.icon-btn.tool { font-size: 1.15rem; }
.home-tools { display: flex; justify-content: center; gap: 6px; margin: -10px 0 14px; }
#sheet { position: fixed; inset: 0; z-index: 40; display: flex; align-items: flex-end; justify-content: center; }
.sheet-backdrop { position: absolute; inset: 0; background: rgba(0,0,0,.45); animation: fade .2s ease both; }
.sheet-card { position: relative; width: 100%; max-width: 520px; max-height: 88vh; overflow-y: auto; background: var(--wood); border-radius: 24px 24px 0 0; padding: 20px 16px calc(18px + env(safe-area-inset-bottom, 0px)); animation: sheetup .3s cubic-bezier(.2,.9,.3,1.1) both; }
.sheet-card h2 { margin-top: 6px; }
@keyframes sheetup { from { transform: translateY(100%); } to { transform: none; } }
@keyframes fade { from { opacity: 0; } }
.stat-scroll { overflow-x: auto; }
.stat-table { width: 100%; border-collapse: collapse; font-size: .95rem; }

.tie-row { display: flex; flex-wrap: wrap; gap: 14px; justify-content: center; margin: 8px 0 14px; }

.ach b { display: block; font-size: .92rem; }
.ach span:last-child { font-size: .76rem; color: var(--muted); }

/* ---- responsive: sizes follow the screen ---- */
#app { padding-left: clamp(10px, 3.5vw, 16px); padding-right: clamp(10px, 3.5vw, 16px); }
.stage { padding: clamp(12px, 4vw, 18px) clamp(10px, 3.5vw, 16px); border-radius: clamp(16px, 5vw, 22px); }

.stage .prompt { font-size: clamp(1.1rem, 5.4vw, 1.45rem); margin: 2px 0 clamp(8px, 2vh, 14px); }

.topbar .wordmark { font-size: clamp(1.3rem, 6vw, 1.6rem); }

.card.mid, .flip3d.mid { --w: clamp(50px, min(17vw, 10vh), 70px); }
.tree .card, .tree .flip3d, .flip3d.hot { --w: clamp(30px, min(10.5vw, 6.4vh), 46px); }
.tree { gap: clamp(4px, 1vh, 6px); }
.tree-row { gap: clamp(4px, 1.5vw, 6px); }
.bus .card { --w: clamp(32px, 11vw, 46px); }
.bus { gap: clamp(4px, 1.5vw, 6px); }
.hand { padding: 18px clamp(10px, 3.5vw, 16px) calc(10px + env(safe-area-inset-bottom, 0px)); }
.hand .cards .card { --w: clamp(42px, min(14vw, 8.5vh), 60px); }

.sheet-card { max-height: 88vh; max-height: 88dvh; }

/* Narrow phones: house-rule controls get their own full-width row */
@media (max-width: 440px) {
  .setting { flex-direction: column; align-items: stretch; gap: 8px; }
  .setting .seg { display: flex; width: 100%; }
  .setting .seg button { flex: 1; padding: 9px 4px; white-space: nowrap; }
  .targets .btn { flex: 1 1 40%; }
  .split-btn { min-height: 50px; }
}
/* Short screens (small phones, landscape): tighten vertical space */
@media (max-height: 680px) {
  .steps { margin-bottom: 4px; }

  .pull { margin: 2px 0 10px; gap: 6px; }
  .pulls { margin-bottom: 8px; }

}

@media (max-height: 500px) and (orientation: landscape) {

  #app { padding-bottom: 96px; max-width: 640px; }
  .card.lg, .flip3d.lg { --w: 64px; }
}

/* ---- home hub ---- */

  border-radius: 18px; border: 2px solid transparent; background: var(--panel); animation: popin .35s cubic-bezier(.2,.9,.3,1.3) both; }

/* ---- shared bits ---- */

/* ---- Paardenrace ---- */
.track { display: grid; gap: 4px; margin: 4px 0 10px; }
.lane { position: relative; height: calc(min(30px, 100% / var(--cols)) * 1.45); min-height: 36px; }
.lane-bg { position: absolute; inset: 0; display: grid; grid-template-columns: repeat(var(--cols), 1fr); gap: 2px; }

/* ---- Mexxen ---- */

@keyframes roll { 0% { transform: rotate(-200deg) translateY(-30px) scale(.6); opacity: 0; } 100% { transform: none; opacity: 1; } }

/* ---- Blackjack ---- */
.stack-big { font-family: var(--display); font-size: clamp(2rem, 10vw, 2.6rem); line-height: 1; margin: 2px 0 10px; color: var(--amber); }

.bj-actions { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; }
.good-txt { color: var(--good); }
.game-grid > .game-tile:last-child:nth-child(odd) { grid-column: 1 / -1; min-height: 0; }

  background: radial-gradient(120% 90% at 50% 30%, #1d7a52 0%, #135c3c 55%, #0d4a2f 100%);
  border: 8px solid #5b3a22; box-shadow: inset 0 0 0 2px rgba(255,255,255,.08), inset 0 10px 40px rgba(0,0,0,.35), 0 10px 24px rgba(0,0,0,.35);

.bj-rule { margin: 10px auto 6px; font-size: .68rem; color: rgba(244,241,230,.55); border-top: 1px solid rgba(244,241,230,.18); border-bottom: 1px solid rgba(244,241,230,.18); padding: 4px 0; max-width: 300px; }
.fan-row { display: flex; justify-content: center; min-height: calc(var(--fw, 52px) * 1.4); }

.reveal-box.good { background: #2f7d32; color: #fff; }
.reveal-box.bad { background: #b3261e; color: #fff; }

/* ---- Who's most likely ---- */
.vote-bars { display: grid; gap: 6px; margin: 4px auto 14px; max-width: 340px; }
.vote-bar { position: relative; display: flex; align-items: center; gap: 10px; padding: 9px 12px; border-radius: 12px; background: var(--panel-2); overflow: hidden; font-weight: 600; }
.vote-bar i { position: absolute; left: 0; top: 0; bottom: 0; background: rgba(242,165,26,.25); z-index: 0; transition: width .5s ease; }
.vote-bar span, .vote-bar b { position: relative; z-index: 1; }
.vote-bar span { flex: 1; text-align: left; }
.vote-bar.top { outline: 2px solid var(--amber); }
/* ---- Ticking bomb ---- */

.name-chip { display: inline-flex; align-items: center; gap: 4px; background: var(--panel-2); padding: 6px 6px 6px 12px; border-radius: 99px; font-weight: 600; }
.name-chip button { border: 0; background: transparent; color: var(--muted); width: 26px; height: 26px; border-radius: 50%; }
.bomb { font-size: clamp(6rem, 34vw, 9rem); line-height: 1; margin: 10px 0 22px; animation: tickpulse var(--speed, .9s) ease-in-out infinite; filter: drop-shadow(0 8px 14px rgba(0,0,0,.4)); }
@keyframes tickpulse { 0%, 100% { transform: scale(1) rotate(-4deg); } 50% { transform: scale(1.12) rotate(4deg); } }
.pass-btn { min-height: clamp(70px, 12vh, 90px) !important; font-size: 1.25rem !important; }
.boom-stage { background: radial-gradient(circle at 50% 30%, #f2a51a 0%, #b3261e 60%, #3a0d08 100%); color: #fff; }
.boom-burst { font-size: clamp(7rem, 40vw, 10rem); line-height: 1; animation: burst .6s cubic-bezier(.2,.9,.3,1.4) both; }
@keyframes burst { from { transform: scale(.2) rotate(-40deg); opacity: 0; } to { transform: none; opacity: 1; } }
.boom-title { font-family: var(--display); font-size: clamp(3rem, 16vw, 4.5rem); line-height: 1; }
.boom-stage .bets .bet-row { background: rgba(0,0,0,.25); }
/* ---- evening awards ---- */

.award span:last-child { font-size: .8rem; color: var(--muted); }
@media (prefers-reduced-motion: reduce) { .bomb, .boom-burst { animation: none; } }

// ===== Game engine: all rules live here and run on the host's screen =====
const Engine = (() => {
  const SUITS = ['hearts', 'diamonds', 'clubs', 'spades'];
  const RED = new Set(['hearts', 'diamonds']);
  const RANK_NAME = { 11: 'J', 12: 'Q', 13: 'K', 14: 'A' };
  const SUIT_SYM = { hearts: '♥', diamonds: '♦', clubs: '♣', spades: '♠' };
  const rankLabel = (r) => RANK_NAME[r] || String(r);
  const cardLabel = (c) => rankLabel(c.r) + SUIT_SYM[c.s];
  const rand = (n) => { const a = new Uint32Array(1); crypto.getRandomValues(a); return a[0] % n; };
  const pickOne = (arr) => arr[rand(arr.length)];
  function shuffle(a) { for (let i = a.length - 1; i > 0; i--) { const j = rand(i + 1); [a[i], a[j]] = [a[j], a[i]]; } return a; }
  function makeDeck() { const d = []; for (const s of SUITS) for (let r = 2; r <= 14; r++) d.push({ r, s }); return shuffle(d); }
  const BOT_NAMES = ['Bram', 'Lotte', 'Joost', 'Noor', 'Daan', 'Femke', 'Sem', 'Isa'];
  const QUESTIONS = {
    1: { text: 'Red or black?', options: ['red', 'black'] },
    2: { text: 'Higher or lower than your first card?', options: ['higher', 'lower'] },
    3: { text: 'Inside or outside your first two cards?', options: ['inside', 'outside'] },
    4: { text: 'Last card: what will it be?', options: ['new', 'have', 'disco', 'duo'] },
  };
  const CHOICE_LABEL = { new: 'I don’t have it yet', have: 'I have the suit', disco: 'disco', duo: 'duo' };
  const choiceLabel = (c) => CHOICE_LABEL[c] || c;
  const DEFAULT_SETTINGS = { unit: 'sips', checkpoints: 'off', wrongSips: 1, discoSips: 1, treeSize: 'normal', treeValues: 'normal', tie: 'total', kingsSips: 2, trackLen: 6, maxBet: 5, maxThrows: 3, loserSips: 1, startSips: 10, nhieCat: 'mild', nhieSips: 1, impCount: 1, impSips: 2, impHint: true, impCat: 'mix', mltSips: 1 };
  // Checkpoint positions in a bus of the given length, per the lobby setting.
  function checkpointsFor(length, mode) {
    if (mode === 'half') return length >= 2 ? [Math.floor(length / 2)] : [];
    return [];
  }
  // Bus length from the picked card: A = 1, 2–10 as shown, J/Q/K = 10.
  const busLengthOf = (c) => (c.r === 14 ? 1 : Math.min(c.r, 10));

  function newState(code, hostId, hostName, gameType) {
    return {
      v: 1, code, hostId, phase: 'lobby', gameType: GAMES[gameType] ? gameType : 'bussen', settings: { ...DEFAULT_SETTINGS },
      players: [mkPlayer(hostId, hostName, false)], log: [], events: [], eventSeq: 0,
      seqs: {}, errors: {}, partners: {}, game: null, updated: Date.now(),
    };
  }
  function mkPlayer(id, name, bot) { return { id, name, bot, hand: [], drank: 0, given: 0, atjes: 0 }; }
  const pById = (st, id) => st.players.find((p) => p.id === id);
  const unitWord = (st, n) => `${n} ${st.settings.unit === 'points' ? 'point' : 'sip'}${n === 1 ? '' : 's'}`;
  const takeVerb = (st) => (st.settings.unit === 'points' ? 'takes' : 'drinks');
  // Log lines are stored as a key plus details, so each phone shows them in its own language.
  function log(st, k, p, kind = 'info') { st.log.push({ k, p: p || {}, kind }); if (st.log.length > 25) st.log.shift(); }
  function event(st, to, payload) {
    st.eventSeq++; st.events.push({ id: st.eventSeq, to, ...payload });
    if (st.events.length > 20) st.events.shift();
  }
  function drink(st, id, amount, reason, viaPartner) {
    const p = pById(st, id); if (!p || amount <= 0) return;
    p.drank += amount;
    log(st, 'drink', { name: p.name, n: amount, unit: st.settings.unit, reason: reason || null }, 'drink');
    if (!p.bot) event(st, id, { kind: 'drink', amount, unit: st.settings.unit, reason: reason || null });
    // A duo partner drinks along with whoever picked them (but not the other way round).
    const partner = st.partners && st.partners[id];
    if (partner && !viaPartner) drink(st, partner, amount, { k: 'rPartner', p: { name: p.name } }, true);
  }
  function drinkAtje(st, id, reason, viaPartner) {
    const p = pById(st, id); if (!p) return;
    if (st.settings.unit === 'points') return drink(st, id, 10, { k: 'rAtje', p: { name: reason && reason.p ? reason.p.name : '' } }, viaPartner);
    p.atjes = (p.atjes || 0) + 1;
    log(st, 'atje', { name: p.name, reason: reason || null }, 'drink');
    if (!p.bot) event(st, id, { kind: 'atje', reason: reason || null });
    const partner = st.partners && st.partners[id];
    if (partner && !viaPartner) drinkAtje(st, partner, { k: 'rPartner', p: { name: p.name } }, true);
  }
  function draw(g) { if (!g.deck.length) g.deck = makeDeck(); return g.deck.pop(); }
  const cleanName = (n) => String(n || '').replace(/\s+/g, ' ').trim().slice(0, 16);

  // ---- questions ----
  function startGame(st) {
    for (const p of st.players) { p.hand = []; p.drank = 0; p.given = 0; p.atjes = 0; p.right = 0; p.wrong = 0; p.laid = 0; p.busRides = 0; p.discos = 0; p.duos = 0; }
    st.partners = {};
    st.phase = 'questions';
    st.game = { deck: makeDeck(), round: 1, turnIdx: 0, pendingPartner: null, lastPull: null };
    st.gameNo = (st.gameNo || 0) + 1;
    log(st, 'started');
  }
  function checkGuess(round, hand, card, choice) {
    if (round === 1) return RED.has(card.s) === (choice === 'red');
    if (round === 2) return choice === 'higher' ? card.r > hand[0].r : card.r < hand[0].r;
    if (round === 3) {
      const lo = Math.min(hand[0].r, hand[1].r), hi = Math.max(hand[0].r, hand[1].r);
      return choice === 'inside' ? card.r > lo && card.r < hi : card.r < lo || card.r > hi;
    }
    const suits = hand.map((c) => c.s);
    const counts = {};
    for (const x of [...suits, card.s]) counts[x] = (counts[x] || 0) + 1;
    const sizes = Object.values(counts).sort();
    if (choice === 'new') return !suits.includes(card.s);
    if (choice === 'have') return suits.includes(card.s);
    if (choice === 'disco') return sizes.length === 4;
    if (choice === 'duo') return sizes.length === 2 && sizes[0] === 2 && sizes[1] === 2;
    return false;
  }
  function advanceTurn(st) {
    const g = st.game; g.pendingPartner = null; g.turnIdx++;
    if (g.turnIdx >= st.players.length) {
      g.turnIdx = 0; g.round++;
      if (g.round > 4) return startPyramid(st);
      log(st, 'round', { n: g.round });
    }
  }
  function guess(st, p, choice) {
    const g = st.game;
    if (st.players[g.turnIdx].id !== p.id || g.pendingPartner) return 'Wait for your turn.';
    if (!QUESTIONS[g.round].options.includes(choice)) return 'Pick one of the options.';
    const card = draw(g);
    const correct = checkGuess(g.round, p.hand, card, choice);
    p.hand.push(card);
    g.lastPull = { playerId: p.id, card, choice, correct, round: g.round, n: (g.lastPull ? g.lastPull.n : 0) + 1 };
    if (correct) p.right = (p.right || 0) + 1; else p.wrong = (p.wrong || 0) + 1;
    log(st, 'guess', { name: p.name, choice, c: card, ok: correct }, correct ? 'good' : 'bad');
    if (!correct) drink(st, p.id, st.settings.wrongSips || 1, { k: 'rWrongRound', p: { n: g.round } });
    else if (choice === 'disco') {
      log(st, 'disco', { name: p.name }, 'good');
      const ds = st.settings.discoSips || 1;
      p.discos = (p.discos || 0) + 1;
      for (const o of st.players) if (o.id !== p.id) { p.given += ds; drink(st, o.id, ds, { k: 'rDisco', p: { name: p.name } }); }
    } else if (choice === 'duo' && st.players.length > 1) {
      g.pendingPartner = { from: p.id }; return null;
    }
    advanceTurn(st); return null;
  }
  function choosePartner(st, p, toId) {
    const g = st.game;
    if (!g.pendingPartner || g.pendingPartner.from !== p.id) return 'You have no partner to pick.';
    const t = pById(st, toId); if (!t || t.id === p.id) return 'Pick another player.';
    st.partners[p.id] = t.id;
    p.duos = (p.duos || 0) + 1;
    log(st, 'partner', { name: p.name, target: t.name }, 'good');
    if (!t.bot) event(st, t.id, { kind: 'partner', from: p.name });
    advanceTurn(st); return null;
  }

  // ---- christmas tree (pyramid) ----
  // Flip order: trunk, then each row upwards; the top card is an atje.
  // Every odd card in flip order is worth double. A rank never shows twice.
  // Rows in flip order with their tier (0 = trunk). Every tree fits in 13 ranks.
  const TREES = {
    small: [['trunk', 1, 0], ['r3', 3, 1], ['r2', 2, 2], ['top', 1, -1]],
    normal: [['trunk', 1, 0], ['r4', 4, 1], ['r3', 3, 2], ['r2', 2, 3], ['top', 1, -1]],
    big: [['trunk', 2, 0], ['r4', 4, 1], ['r3', 3, 2], ['r2', 2, 3], ['top', 1, -1]],
  };
  function tierValue(tier, mode) {
    const base = tier === 0 ? 1 : tier;               // normal: trunk 1, rows 1, 2, 3
    if (mode === 'steep') return tier === 0 ? 1 : tier + 1;   // trunk 1, rows 2, 3, 4
    if (mode === 'double') return base * 2;           // everything twice
    return base;
  }
  function startPyramid(st) {
    const old = st.game, slots = [];
    const rows = TREES[st.settings.treeSize] || TREES.normal;
    for (const [row, count, tier] of rows) for (let i = 0; i < count; i++) {
      const n = slots.length + 1, atje = row === 'top', double = !atje && n % 2 === 1;
      const base = atje ? 1 : tierValue(tier, st.settings.treeValues);
      slots.push({ row, col: i, atje, double, worth: atje ? 1 : base * (double ? 2 : 1), card: null });
    }
    st.phase = 'pyramid';
    st.game = { deck: old.deck, slots, flipped: 0, claims: [] };
    log(st, 'tree');
  }
  const current = (g) => (g.flipped > 0 ? g.slots[g.flipped - 1] : null);
  function flip(st) {
    const g = st.game; if (g.flipped >= g.slots.length) return 'All cards are flipped.';
    const used = new Set(g.slots.filter((x) => x.card).map((x) => x.card.r));
    let card, tries = 0;
    do { card = draw(g); tries++; } while (used.has(card.r) && tries < 300);
    const slot = g.slots[g.flipped]; slot.card = card; g.flipped++;
    g.claims = g.claims.filter((c) => c.flipIdx >= g.flipped - 1);
    log(st, slot.atje ? 'flipTop' : 'flip', { c: card, n: slot.worth, unit: st.settings.unit });

        return false;
      }
      if (g.stage === 'reveal') { const b = st.players[g.turnIdx]; if (!b.bot) return false; NHIE.actions.nNext(st, b, {}, false); return true; }
      return false;
    },
    view(st, me) {
      const g = st.game, revealed = g.stage === 'reveal';
      return { stage: g.stage, q: g.q, turnId: st.players[g.turnIdx].id, round: g.round, n: g.n,
        answered: Object.keys(g.answers), mine: g.answers[me], drinkers: revealed ? g.drinkers : [] };
    },
  };

  // ---------- Imposter ----------
  // Everyone gets the same secret word, except the imposter. Go round giving one-word clues,
  // then vote. Catch the imposter and they drink; let them escape and everyone else drinks.
  const CATS = ['food', 'animals', 'places', 'jobs', 'things', 'pop'];
  const Imp = {
    start(st) {
      resetPlayers(st);
      st.phase = 'play';
      Imp.newRound(st, 1);
      log(st, 'iStart');
    },
    newRound(st, round) {
      const setCat = st.settings.impCat || 'mix';
      // Custom words come from the host's own list; with fewer than two, fall back to the mix.
      const custom = (st.settings.impCustom || []).filter(Boolean);
      let cat, i, word = null;
      if (setCat === 'custom' && custom.length >= 2) { cat = 'custom'; i = rand(custom.length); word = custom[i]; }
      else { cat = CATS.includes(setCat) ? setCat : pickOne(CATS); i = rand(CONTENT.words[cat].length); }
      const want = Math.min(st.settings.impCount || 1, Math.max(1, st.players.length - 2));
      const imposters = shuffle(st.players.map((p) => p.id)).slice(0, want);
      st.game = { round, cat, i, word, imposters, starter: pickOne(st.players).id,
        stage: 'reveal', ready: {}, votes: {}, result: null, n: (st.game && st.game.n || 0) + 1 };
    },
    tally(st) {
      const g = st.game, counts = {};
      for (const to of Object.values(g.votes)) counts[to] = (counts[to] || 0) + 1;
      const top = Math.max(0, ...Object.values(counts));
      const leaders = Object.keys(counts).filter((id) => counts[id] === top);
      const target = leaders.length === 1 ? leaders[0] : null;
      const caught = !!target && g.imposters.includes(target);
      const sips = st.settings.impSips || 2;
      g.stage = 'result'; g.n++;
      g.result = { caught, target, counts };
      log(st, caught ? 'iCaught' : 'iEscaped', {}, caught ? 'good' : 'bad');
      for (const p of st.players) {
        if (g.imposters.includes(p.id)) { if (!caught) p.impEscapes = (p.impEscapes || 0) + 1; continue; }
        if (caught && g.imposters.includes(g.votes[p.id])) { p.impStreak = (p.impStreak || 0) + 1; p.impBest = Math.max(p.impBest || 0, p.impStreak); }
        else p.impStreak = 0;
      }
      if (caught) for (const id of g.imposters) drink(st, id, sips, { k: 'rImpCaught' });
      else for (const p of st.players) if (!g.imposters.includes(p.id)) drink(st, p.id, sips, { k: 'rImpEscaped' });
    },
    actions: {
      iReady(st, p) {
        const g = st.game; if (g.stage !== 'reveal') return 'Not now.';
        g.ready[p.id] = true;
        if (st.players.every((x) => g.ready[x.id])) { g.stage = 'clues'; g.n++; }
        return null;
      },
      iToVote(st, p, a, isHost) {
        const g = st.game; if (!isHost) return 'Only the host can do that.';
        if (g.stage !== 'clues') return 'Not now.';
        g.stage = 'vote'; g.n++; return null;
      },
      iCast(st, p, a) {
        const g = st.game; if (g.stage !== 'vote') return 'Not now.';
        const t = pById(st, a.to); if (!t || t.id === p.id) return 'Pick another player.';
        g.votes[p.id] = t.id;
        if (st.players.every((x) => g.votes[x.id])) Imp.tally(st);
        return null;
      },
      iNext(st, p, a, isHost) {
        if (!isHost) return 'Only the host can do that.';
        if (st.game.stage !== 'result') return 'Not now.';
        Imp.newRound(st, st.game.round + 1); return null;
      },
      iEnd(st, p, a, isHost) {
        if (!isHost) return 'Only the host can do that.';
        endPlay(st, { type: 'imposter', rounds: st.game.round }); return null;
      },
    },
    skip(st) {
      const g = st.game;
      if (g.stage === 'reveal') { for (const x of st.players) g.ready[x.id] = true; g.stage = 'clues'; g.n++; return null; }
      if (g.stage === 'vote') { Imp.tally(st); return null; }
      return 'Nothing to skip.';
    },
    bot(st) {
      const g = st.game;
      if (g.stage === 'reveal') { const b = st.players.find((x) => x.bot && !g.ready[x.id]); if (b) { Imp.actions.iReady(st, b); return true; } return false; }
      if (g.stage === 'vote') { const b = st.players.find((x) => x.bot && !g.votes[x.id]); if (b) { Imp.actions.iCast(st, b, { to: pickOne(others(st, b)).id }); return true; } return false; }
      return false;
    },
    view(st, me) {
      const g = st.game, isImp = g.imposters.includes(me), done = g.stage === 'result';
      return { stage: g.stage, round: g.round, n: g.n, starter: g.starter,
        role: isImp ? { imposter: true, cat: st.settings.impHint === false ? null : g.cat } : { imposter: false, cat: g.cat, i: g.i, word: g.word },
        ready: Object.keys(g.ready), voted: Object.keys(g.votes), myVote: g.votes[me] || null,
        result: done ? { ...g.result, imposters: g.imposters, cat: g.cat, i: g.i, word: g.word } : null };
    },
  };

  // ---------- Who's most likely to ----------
  // A statement appears, everyone votes for someone at the same time; the most votes drinks.
  const MLT = {
    deck() { return shuffle(CONTENT.mlt.map((_, i) => ({ i }))); },
    start(st) {
      resetPlayers(st);
      st.phase = 'play';
      st.game = { turnIdx: 0, stage: 'pick', q: null, votes: {}, deck: MLT.deck(), round: 0, n: 0, top: [], counts: {} };
      log(st, 'wStart');
    },
    ask(st, q) { const g = st.game; g.q = q; g.votes = {}; g.top = []; g.counts = {}; g.stage = 'vote'; g.round++; g.n++; },
    reveal(st) {
      const g = st.game, counts = {};
      for (const to of Object.values(g.votes)) counts[to] = (counts[to] || 0) + 1;
      const max = Math.max(0, ...Object.values(counts));
      g.counts = counts; g.top = max ? Object.keys(counts).filter((id) => counts[id] === max) : [];
      g.stage = 'reveal'; g.n++;
      const sips = st.settings.mltSips || 1;
      for (const id of g.top) { const p = pById(st, id); if (p) p.mltTop = (p.mltTop || 0) + 1; drink(st, id, sips, { k: 'rMlt' }); }
    },
    actions: {
      wRandom(st, p) {
        const g = st.game; if (g.stage !== 'pick' || st.players[g.turnIdx].id !== p.id) return 'Wait for your turn.';
        if (!g.deck.length) g.deck = MLT.deck();
        MLT.ask(st, g.deck.pop()); return null;
      },
      wOwn(st, p, a) {
        const g = st.game; if (g.stage !== 'pick' || st.players[g.turnIdx].id !== p.id) return 'Wait for your turn.';
        const text = String(a.text || '').replace(/\s+/g, ' ').trim().slice(0, 120);
        if (!text) return 'Write a statement first.';
        MLT.ask(st, { text, by: p.name }); return null;
      },
      wVote(st, p, a) {
        const g = st.game; if (g.stage !== 'vote') return 'Not now.';
        if (!pById(st, a.to)) return 'Pick a player.';
        g.votes[p.id] = a.to;
        if (st.players.every((x) => g.votes[x.id])) MLT.reveal(st);
        return null;
      },
      wNext(st, p, a, isHost) {
        const g = st.game; if (g.stage !== 'reveal') return 'Not now.';
        if (!isHost && st.players[g.turnIdx].id !== p.id) return 'Only the reader or the host can go on.';
        g.turnIdx = (g.turnIdx + 1) % st.players.length; g.stage = 'pick'; g.q = null; g.n++; return null;
      },
      wEnd(st, p, a, isHost) {
        if (!isHost) return 'Only the host can do that.';
        endPlay(st, { type: 'mlt', rounds: st.game.round }); return null;
      },
    },
    skip(st) {
      const g = st.game;
      if (g.stage === 'pick') { if (!g.deck.length) g.deck = MLT.deck(); MLT.ask(st, g.deck.pop()); return null; }
      if (g.stage === 'vote') { MLT.reveal(st); return null; }
      return 'Nothing to skip.';
    },
    bot(st) {
      const g = st.game;
      if (g.stage === 'pick') { const b = st.players[g.turnIdx]; if (!b.bot) return false; MLT.actions.wRandom(st, b); return true; }
      if (g.stage === 'vote') { const b = st.players.find((x) => x.bot && !g.votes[x.id]); if (b) { MLT.actions.wVote(st, b, { to: pickOne(st.players).id }); return true; } return false; }
      if (g.stage === 'reveal') { const b = st.players[g.turnIdx]; if (!b.bot) return false; MLT.actions.wNext(st, b, {}, false); return true; }
      return false;
    },
    view(st, me) {
      const g = st.game, revealed = g.stage === 'reveal';
      return { stage: g.stage, q: g.q, turnId: st.players[g.turnIdx].id, round: g.round, n: g.n,
        voted: Object.keys(g.votes), myVote: g.votes[me] || null, top: revealed ? g.top : [], counts: revealed ? g.counts : {} };
    },
  };

  const GAMES = { blackjack: BJ, nhie: NHIE, imposter: Imp, mlt: MLT };

  // ---- evening score: every finished game adds to a running total for the night ----
  function countEvening(st) {
    if (st.phase !== 'ended' || st.eveningCounted === st.gameNo) return;
    st.eveningCounted = st.gameNo;
    st.evening = st.evening || {};
    for (const p of st.players) {
      if (p.bot) continue;
      const e = st.evening[p.id] || (st.evening[p.id] = { name: p.name, drank: 0, given: 0, atjes: 0, bus: 0, games: 0 });
      e.name = p.name; e.drank += p.drank || 0; e.given += p.given || 0; e.atjes += p.atjes || 0; e.bus += p.busRides || 0; e.games += 1;
    }
  }
  function apply(st, pid, type, a) { const err = applyAction(st, pid, type, a); if (!err) countEvening(st); return err; }
  // ---- one entry point for every action ----
  function applyAction(st, pid, type, a) {
    const isHost = pid === st.hostId;
    if (type === 'join') {
      if (pById(st, pid)) return null;
      const n = cleanName(a.name);
      if (!n) return 'Enter your name first.';
      if (st.phase !== 'lobby') return 'That game has already started. Ask the host to go back to the lobby.';
      if (st.players.length >= 9) return 'That game is full (9 players).';
      if (st.players.some((p) => p.name.toLowerCase() === n.toLowerCase())) return 'Someone in this game already uses that name.';
      st.players.push(mkPlayer(pid, n, false)); log(st, 'joined', { name: n }); return null;
    }
    const p = pById(st, pid);
    if (!p) return 'You are not in this game.';
    const host = (fn) => (isHost ? fn() : 'Only the host can do that.');
    const G = GAMES[st.gameType];
    if (G && G.actions[type]) return st.phase === 'play' ? G.actions[type](st, p, a, isHost) : 'Not now.';
    switch (type) {
      case 'addBot': return host(() => {
        if (st.phase !== 'lobby') return 'Add bots in the lobby.';
        if (st.players.length >= 9) return 'The game is full.';
        const used = new Set(st.players.map((x) => x.name));
        const name = BOT_NAMES.find((n) => !used.has(n)) || 'Bot ' + st.players.length;
        st.eventSeq++;
        st.players.push(mkPlayer('bot' + st.eventSeq, name, true)); log(st, 'botJoined', { name }); return null;
      });
      case 'remove': return host(() => {
        if (st.phase !== 'lobby') return 'Remove players in the lobby.';
        if (a.id === st.hostId) return 'The host stays.';
        const x = pById(st, a.id); if (!x) return null;
        st.players = st.players.filter((y) => y.id !== a.id); log(st, 'removed', { name: x.name }); return null;
      });
      case 'settings': return host(() => {
        if (st.phase !== 'lobby') return 'Rules can only change in the lobby.';
        const s = st.settings, q = a.patch || {};
        if (q.unit === 'sips' || q.unit === 'points') s.unit = q.unit;
        if (['off', 'half', 'pull'].includes(q.checkpoints)) s.checkpoints = q.checkpoints;
        if ([1, 2, 3].includes(q.wrongSips)) s.wrongSips = q.wrongSips;
        if ([1, 2, 3].includes(q.discoSips)) s.discoSips = q.discoSips;
        if (['small', 'normal', 'big'].includes(q.treeSize)) s.treeSize = q.treeSize;
        if (['normal', 'steep', 'double'].includes(q.treeValues)) s.treeValues = q.treeValues;
        if (['total', 'drawoff', 'all'].includes(q.tie)) s.tie = q.tie;
        if ([1, 2, 3].includes(q.kingsSips)) s.kingsSips = q.kingsSips;
        if ([5, 6, 7].includes(q.trackLen)) s.trackLen = q.trackLen;
        if ([3, 5].includes(q.maxBet)) s.maxBet = q.maxBet;
        if ([1, 2, 3].includes(q.maxThrows)) s.maxThrows = q.maxThrows;
        if ([1, 2, 3].includes(q.loserSips)) s.loserSips = q.loserSips;
        if ([5, 10, 20].includes(q.startSips)) s.startSips = q.startSips;
        if (['mild', 'spicy', 'mix'].includes(q.nhieCat)) s.nhieCat = q.nhieCat;
        if ([1, 2, 3].includes(q.nhieSips)) s.nhieSips = q.nhieSips;
        if ([1, 2].includes(q.impCount)) s.impCount = q.impCount;
        if ([1, 2, 3].includes(q.impSips)) s.impSips = q.impSips;
        if ([1, 2, 3].includes(q.mltSips)) s.mltSips = q.mltSips;
        if (typeof q.impHint === 'boolean') s.impHint = q.impHint;
        if (['mix', 'food', 'animals', 'places', 'jobs', 'things', 'pop', 'custom'].includes(q.impCat)) s.impCat = q.impCat;
        if (Array.isArray(q.impCustom)) s.impCustom = [...new Set(q.impCustom.map((w) => String(w).replace(/\s+/g, ' ').trim().slice(0, 30)).filter(Boolean))].slice(0, 60);
        return null;
      });
      case 'start': return host(() => {
        if (st.phase !== 'lobby') return 'The game is already running.';
        if (G) G.start(st); else startGame(st);
        return null;
      });
      case 'guess': return st.phase === 'questions' ? guess(st, p, a.choice) : 'Not now.';
      case 'partner': return st.phase === 'questions' ? choosePartner(st, p, a.to) : 'Not now.';
      case 'flip': return st.phase === 'pyramid' ? host(() => flip(st)) : 'Not now.';
      case 'claim': return st.phase === 'pyramid' ? claim(st, p, a.cardIndexes != null ? a.cardIndexes : a.cardIndex, a.split) : 'Not now.';
      case 'finishPyramid': return st.phase === 'pyramid' ? host(() => finishPyramid(st)) : 'Not now.';
      case 'busGuess': return st.phase === 'bus' ? busGuess(st, p, a.choice) : 'Not now.';
      case 'pickBus': return st.phase === 'bus' ? pickBus(st, p, a.index) : 'Not now.';
      case 'pickCheckpoint': return st.phase === 'bus' ? pickCheckpoint(st, p, a.index) : 'Not now.';
      case 'pickFaceUp': return st.phase === 'bus' ? pickFaceUp(st, p, a.index) : 'Not now.';
      case 'drawTie': return st.phase === 'tiebreak' ? drawTie(st, p) : 'Not now.';
      case 'tieContinue': return st.phase === 'tiebreak' ? host(() => {
        if (!st.game.loserId) return 'Everyone has to draw first.';
        startBus(st, pById(st, st.game.loserId), [], []); return null;
      }) : 'Not now.';
      case 'takeHost': {
        // A player whose phone took over the host lease becomes the host.
        if (p.bot) return 'Bots cannot host.';
        if (st.hostId !== pid) { st.hostId = pid; log(st, 'hostNow', { name: p.name }); }
        return null;
      }
      case 'setGame': return host(() => {
        if (st.phase !== 'lobby') return 'Change the game in the lobby.';
        if (a.game !== 'bussen' && !GAMES[a.game]) return 'Unknown game.';
        st.gameType = a.game; return null;
      });
      case 'skip': return host(() => {
        if (G) return G.skip(st);
        if (st.phase === 'questions') {
          const g = st.game, act = st.players[g.turnIdx];
          if (g.pendingPartner) { g.pendingPartner = null; } else act.hand.push(draw(g));
          log(st, 'skipped', { name: act.name }); advanceTurn(st); return null;
        }
        return 'Nothing to skip.';
      });
      case 'newGame': return host(() => {
        st.phase = 'lobby'; st.game = null; st.partners = {}; for (const x of st.players) x.hand = [];
        log(st, 'lobby'); return null;
      });
      case 'leave': {
        if (isHost) { st.phase = 'closed'; log(st, 'closed'); return null; }
        if (st.phase === 'lobby') { st.players = st.players.filter((x) => x.id !== pid); log(st, 'left', { name: p.name }); }
        else log(st, 'leftTable', { name: p.name });
        return null;
      }
    }
    return 'Unknown action.';
  }

  // ---- bots: the host's screen plays for them, one move per tick ----
  function botStep(st) { const moved = botMove(st); if (moved) countEvening(st); return moved; }
  function botMove(st) {
    if (GAMES[st.gameType]) return st.phase === 'play' ? GAMES[st.gameType].bot(st) : false;
    if (st.phase === 'questions') {
      const g = st.game;
      if (g.pendingPartner) {
        const b = pById(st, g.pendingPartner.from);
        if (b && b.bot) { choosePartner(st, b, pickOne(st.players.filter((x) => x.id !== b.id)).id); return true; }
        return false;
      }
      const b = st.players[g.turnIdx];
      if (!b.bot) return false;
      let c;
      if (g.round === 1) c = pickOne(['red', 'black']);
      else if (g.round === 2) c = b.hand[0].r >= 8 ? 'lower' : 'higher';
      else if (g.round === 3) c = Math.abs(b.hand[0].r - b.hand[1].r) > 6 ? 'inside' : 'outside';
      else {
        const counts = {};
        for (const x of b.hand) counts[x.s] = (counts[x.s] || 0) + 1;
        const sizes = Object.values(counts);
        c = sizes.length === 3 ? 'disco' : sizes.length === 2 ? pickOne(['have', 'duo', 'new']) : 'have';
      }
      guess(st, b, c); return true;
    }
    if (st.phase === 'pyramid') {
      const g = st.game, cur = current(g); if (!cur) return false;
      for (const b of st.players.filter((x) => x.bot)) {
        const idx = b.hand.map((c, i) => (c.r === cur.card.r ? i : -1)).filter((i) => i >= 0);
        if (idx.length) { claim(st, b, idx, { [pickOne(st.players.filter((x) => x.id !== b.id)).id]: (cur.atje ? 1 : cur.worth) * idx.length }); return true; }
      }
      return false;
    }
    if (st.phase === 'tiebreak') {
      const g = st.game;
      if (g.loserId) return false;
      const b = st.players.find((x) => x.bot && g.tied.includes(x.id) && !g.draws[x.id]);
      if (b) { drawTie(st, b); return true; }
      return false;
    }
    if (st.phase === 'bus') {
      const g = st.game, b = pById(st, g.riderId);
      if (!b || !b.bot) return false;
      if (g.stage === 'pick') { pickBus(st, b, rand(g.choices.length)); return true; }
      if (g.stage === 'pickcp') { pickCheckpoint(st, b, rand(g.cpChoices.length)); return true; }
      if (g.stage === 'pickup') { pickFaceUp(st, b, rand(g.upChoices.length)); return true; }
      if (!g.faceUp[g.pos]) { busGuess(st, b, pickOne(['red', 'black'])); return true; }
      busGuess(st, b, g.positions[g.pos].r >= 8 ? 'lower' : 'higher'); return true;
    }
    return false;
  }

  // ---- what one player's screen may show ----
  function view(st, me) {
    const meP = pById(st, me);
    const v = {
      code: st.code, phase: st.phase, settings: st.settings, hostId: st.hostId,
      me: { id: me, name: meP ? meP.name : '', isHost: st.hostId === me, joined: !!meP },
      players: st.players.map((p) => ({ id: p.id, name: p.name, bot: p.bot, cardCount: p.hand.length, drank: p.drank, given: p.given, atjes: p.atjes || 0, right: p.right || 0, wrong: p.wrong || 0, laid: p.laid || 0, busRides: p.busRides || 0, discos: p.discos || 0, duos: p.duos || 0, impBest: p.impBest || 0, impEscapes: p.impEscapes || 0, bjMax: p.bjMax || 0, bjNaturals: p.bjNaturals || 0, nhieHave: p.nhieHave || 0, nhieRounds: p.nhieRounds || 0, mltTop: p.mltTop || 0, partner: (st.partners || {})[p.id] || null })),
      log: st.log, hand: meP ? meP.hand : [], gameType: st.gameType || 'bussen', evening: st.evening || {},
    };
    if (GAMES[st.gameType]) {
      if (st.phase === 'play') v.play = GAMES[st.gameType].view(st, me);
      if (st.phase === 'ended') v.ended = { ...(st.game && st.game.summary), results: [] };
      v.gameNo = st.gameNo || 0;
      return v;
    }
    const g = st.game;
    if (st.phase === 'questions') {
      const act = st.players[g.turnIdx];
      v.questions = { round: g.round, question: QUESTIONS[g.round].text, options: QUESTIONS[g.round].options,
        activeId: act.id, activeCards: act.hand, pendingPartner: g.pendingPartner, lastPull: g.lastPull };
    } else if (st.phase === 'pyramid') {
      v.pyramid = { flipped: g.flipped, total: g.slots.length,
        slots: g.slots.map((x, i) => ({ row: x.row, col: x.col, atje: x.atje, double: x.double, worth: x.worth, card: i < g.flipped ? x.card : null })),
        claims: g.claims.filter((c) => c.flipIdx === g.flipped).map((c) => ({ id: c.id, from: c.from, cards: c.cards || [c.card], atje: c.atje, split: c.split })) };
    } else if (st.phase === 'bus') {
      v.bus = { riderId: g.riderId, stage: g.stage, picked: g.picked, pickedCard: g.picked === null ? null : g.choices[g.picked],
        choiceCount: g.choices.length, cpChoiceCount: g.cpChoices ? g.cpChoices.length : 0,
        cpCard: g.cpPicked != null ? g.cpChoices[g.cpPicked] : null, length: g.length, checkpoints: g.checkpoints || [],
        upChoiceCount: g.upChoices ? g.upChoices.length : 0, upCard: g.upPicked != null ? g.upChoices[g.upPicked] : null,

    },
  };
  // Engine messages (English) shown to Dutch players.
  const NL_ERRORS = {
    'Wait for your turn.': 'Wacht op je beurt.', 'Pick another player.': 'Kies een andere speler.', 'Pick other players.': 'Kies andere spelers.',
    'Only the host can do that.': 'Alleen de host kan dat.', 'Not now.': 'Nu niet.', 'Enter your name first.': 'Vul eerst je naam in.',

  };
  let lang = store.get('bussen:lang') || ((navigator.language || '').toLowerCase().startsWith('nl') ? 'nl' : 'en');
  function t(key, p = {}) {
    const s = I18N[lang][key] !== undefined ? I18N[lang][key] : I18N.en[key];
    if (s === undefined) return key;
    if (typeof s === 'function') return s(p);
    return s.replace(/\{(\w+)\}/g, (_, k) => (p[k] !== undefined ? p[k] : ''));
  }
  const tErr = (msg) => (lang === 'nl' && NL_ERRORS[msg]) || msg;
  function reasonText(r) {
    if (!r) return '';
    if (typeof r === 'string') return r;
    const pp = { ...(r.p || {}) }; if (pp.r) pp.rank = rk(pp.r);
    return t('r_' + r.k, pp);
  }
  function logText(l) {
    if (l.text) return l.text;
    const p = { ...(l.p || {}) };
    if (p.c) p.card = cardText(p.c);
    if (p.cards) p.cards = p.cards.map(cardText).join(' ');
    if (p.choice) p.choice = t('c_' + p.choice);
    if (p.reason) p.reason = reasonText(p.reason);
    if (p.suit) p.suit = `${SUIT[p.suit]} ${t('s_' + p.suit)}`;
    if (p.d) p.dice = DICE[p.d[0]] + DICE[p.d[1]];
    p.points = p.unit === 'points';
    if (p.n !== undefined && (l.k === 'drink' || l.k === 'flip')) p.amount = t('unit', { n: p.n, points: p.points });
    return t('log_' + l.k, p);
  }
  const hex = (n) => Array.from(crypto.getRandomValues(new Uint8Array(n)), (b) => b.toString(16).padStart(2, '0')).join('');

  let pid = store.get('bussen:pid');
  if (!pid) { pid = 'p' + hex(8); store.set('bussen:pid', pid); }

  // ---- connection state ----
  let db = null, dbStatus = 'pending';
  let code = null, hosting = false, st = null, S = null;
  let unsubs = [];
  let lastEvent = null, lastErr = null;
  let ui = { pick: null, target: null, split: {}, history: false, homeError: '', leaveArmed: 0, loadingNote: '', revealUntil: 0, busRevealUntil: 0 };
  let prevDrank = {}, prevHand = 0, treeIntro = '';
  let seen = { pull: 0, bus: 0, flipped: 0 };
  let toasts = [];

  let snackTimer;
  function snack(text) {
    clearTimeout(snackTimer);
    let el = document.querySelector('.snack');
    if (!el) { el = document.createElement('div'); el.className = 'snack'; el.setAttribute('role', 'status'); document.body.appendChild(el); }
    el.textContent = tErr(text);
    snackTimer = setTimeout(() => el.remove(), 3200);
  }

  // ---- host: write the whole game to the shared store, one write at a time ----
  let writing = false, dirty = false;
  async function writeState() {
    if (!db || !hosting) return;
    if (writing) { dirty = true; return; }
    writing = true;
    do {
      dirty = false;
      const body = JSON.parse(JSON.stringify(st));
      try { await db.doc('games/' + code).set(body); }
      catch (e) {
        if (e && e.code === 'unavailable') { await new Promise((r) => setTimeout(r, 400 + Math.random() * 600)); dirty = true; }
        else if (e && e.code === 'invalid_argument') { snack('Your account can only watch here, so the game is not shared. Ask the owner for edit access.'); }
        else snack('Could not save the game. Check your connection.');
      }
    } while (dirty);
    writing = false;
  }

  let botTimer = null;
  function scheduleBots() {
    if (!hosting || botTimer) return;
    botTimer = setTimeout(() => {
      botTimer = null;
      if (st && Engine.botStep(st)) commit();
    }, 1000);
  }

  function commit() {
    st.updated = Date.now();
    onState(st);
    writeState();
    scheduleBots();
  }

  // ---- everyone: react to a new game state ----
  function onState(state) {
    const prevPhase = S ? S.phase : null;
    S = Engine.view(state, pid);
    if (prevPhase !== S.phase) { ui.pick = null; ui.target = null; ui.split = {}; if (S.phase === 'bus') Sound.horn(); }
    if (lastEvent === null) lastEvent = state.eventSeq;
    for (const e of state.events) if (e.id > lastEvent && e.to === pid) toasts.push(e);
    lastEvent = state.eventSeq;
    const err = state.errors && state.errors[pid];
    if (lastErr === null) lastErr = err ? err.seq : 0;
    if (err && err.seq > lastErr) {
      lastErr = err.seq;
      if (!S.me.joined) { ui.homeError = tErr(err.msg); leaveLocal(); return render(); }
      snack(err.msg);
    }
    countFinishedGame();
    render();
    if (sheetOpen === 'stats' || sheetOpen === 'evening') renderSheet();
    showNextToast();
  }

  // ---- player: send a move to the host ----
  let mySeq = 0, myQueue = [], sendChain = Promise.resolve();
  function send(type, payload) {
    mySeq = Math.max(Date.now(), mySeq + 1);
    myQueue.push({ seq: mySeq, type, payload: payload || {} });
    myQueue = myQueue.slice(-10);
    const body = { seq: mySeq, queue: myQueue.slice() };
    sendChain = sendChain.then(() => db.doc(`games/${code}/actions/${pid}`).set(body)).catch((e) => {
      snack(e && e.code === 'invalid_argument'
        ? 'You can watch this game but not play. Ask the owner to give you Contributor or Editor access.'
        : 'Could not send your move. Try again.');
    });
  }

  function act(type, payload) {
    if (hosting) {
      const err = Engine.apply(st, pid, type, payload || {});
      if (err) { snack(err); return false; }
      commit(); return true;
    }
    send(type, payload); return true;
  }

  // ---- host: listen for everyone's moves ----
  function listenForMoves() {
    const u = db.collection(`games/${code}/actions`).onSnapshot((snap) => {
      let changed = false;
      for (const d of snap.docs) {
        const from = d.id, body = d.data();
        if (!body || from === pid || !Array.isArray(body.queue)) continue;
        for (const a of body.queue) {
          if ((st.seqs[from] || 0) >= a.seq) continue;
          st.seqs[from] = a.seq;
          const err = Engine.apply(st, from, a.type, a.payload || {});
          if (err) st.errors[from] = { seq: a.seq, msg: err };
          changed = true;
        }
      }
      if (changed) commit();
    }, () => snack('Lost the connection to the other players. Reload to reconnect.'));
    movesUnsub = u; unsubs.push(u);
  }

  // ---- player: follow the host's game ----
  function followGame() {
    let timer = setTimeout(() => { ui.loadingNote = t('outOfDate'); render(); }, 10000);
    const u = db.doc('games/' + code).onSnapshot((snap) => {
      if (!snap.metadata.fromCache) { clearTimeout(timer); ui.loadingNote = ''; }
      if (!snap.exists) { ui.homeError = t('gone'); leaveLocal(); return render(); }
      onState(snap.data());
    }, () => { clearTimeout(timer); snack('Lost the connection to the game. Reload to reconnect.'); });
    followUnsub = u; unsubs.push(u);
  }

  // ---- host handover: the host holds a short lease and renews it every few seconds.
  // If the host's phone locks or leaves, the lease runs out and another player takes over.
  const LEASE_MS = 15000;
  let leaseTimer = null, followUnsub = null, movesUnsub = null;
  async function tryLease() {
    try { const r = await db.doc(`games/${code}/lease/host`).acquire({ holder: pid, ttlMs: LEASE_MS }); return !!(r && r.acquired); }
    catch (e) { return null; }
  }
  function startLeaseLoop() {
    clearInterval(leaseTimer); leaseTimer = null;
    if (!db || !code) return;
    leaseTimer = setInterval(async () => {
      if (!code) return;
      if (hosting) { if ((await tryLease()) === false) demote(); }
      else if (S && S.me.joined && S.phase !== 'closed') { if (await tryLease()) promote(); }
    }, hosting ? 5000 : 8000);
  }
  async function promote() {
    if (hosting || !code) return;
    let snap; try { snap = await db.doc('games/' + code).get(); } catch (e) { return; }
    if (!snap.exists || snap.data().phase === 'closed') return;
    if (followUnsub) { try { followUnsub(); } catch (e) {} followUnsub = null; }
    st = JSON.parse(JSON.stringify(snap.data()));
    hosting = true;
    Engine.apply(st, pid, 'takeHost', {});
    listenForMoves(); startLeaseLoop(); commit();
  }
  function demote() {
    if (!hosting) return;
    hosting = false;
    if (movesUnsub) { try { movesUnsub(); } catch (e) {} movesUnsub = null; }
    clearTimeout(botTimer); botTimer = null;
    followGame(); startLeaseLoop();
  }

  function leaveLocal() {
    unsubs.forEach((u) => { try { u(); } catch (e) {} });
    unsubs = []; clearTimeout(botTimer); botTimer = null; clearInterval(leaseTimer); leaseTimer = null; followUnsub = null; movesUnsub = null;
    code = null; hosting = false; st = null; S = null; lastEvent = null; lastErr = null; myQueue = [];
    store.del('bussen:session');
  }

  const CODE_CHARS = 'ABCDEFGHJKLMNPQRSTUVWXYZ';
  const newCode = () => Array.from({ length: 4 }, () => CODE_CHARS[crypto.getRandomValues(new Uint8Array(1))[0] % CODE_CHARS.length]).join('');

  async function createGame(name, gameType) {
    let c = newCode();
    if (db) {
      for (let i = 0; i < 5; i++) {
        try { const s = await db.doc('games/' + c).get(); if (!s.exists) break; } catch (e) { break; }
        c = newCode();
      }
    }
    code = c; hosting = true; lastEvent = 0; lastErr = 0;
    st = Engine.newState(code, pid, name, gameType);
    store.set('bussen:session', { code, online: !!db });
    if (db) { await tryLease(); listenForMoves(); startLeaseLoop(); }
    commit();
  }

  async function joinGame(name, c) {
    c = String(c || '').toUpperCase().trim();
    if (!db) { ui.homeError = t('needOnline'); return render(); }
    if (c.length !== 4) { ui.homeError = t('fourLetters'); return render(); }
    let snap;
    try { snap = await db.doc('games/' + c).get(); } catch (e) { ui.homeError = t('cantReach'); return render(); }
    if (!snap.exists || snap.data().phase === 'closed') { ui.homeError = t('noGame'); return render(); }
    code = c; hosting = false;
    store.set('bussen:session', { code, online: true });
    followGame();
    send('join', { name });
    startLeaseLoop();

    const data = snap.data();
    if (data.phase === 'closed' || !data.players.some((p) => p.id === pid)) { store.del('bussen:session'); return render(); }
    code = sess.code;
    if (data.hostId === pid && (await tryLease()) !== false) {
      hosting = true; st = JSON.parse(JSON.stringify(data));
      lastEvent = st.eventSeq; lastErr = 0;
      listenForMoves(); onState(st); scheduleBots();
    } else {
      hosting = false; followGame();
    }
    startLeaseLoop();
  }

  // ---------- sound: small synthesized effects, no files needed ----------
  const Sound = (() => {
    let ctx = null, lastFlip = 0;
    const on = () => store.get('bussen:sound') !== false;
    function ac() {
      if (!ctx) { const C = window.AudioContext || window.webkitAudioContext; if (!C) return null; try { ctx = new C(); } catch (e) { return null; } }
      if (ctx.state === 'suspended') ctx.resume().catch(() => {});
      return ctx;
    }
    function tone(freq, dur, type = 'sine', vol = 0.2, when = 0, slideTo = null) {
      const c = ac(); if (!c) return;
      const t0 = c.currentTime + when, o = c.createOscillator(), g = c.createGain();
      o.type = type; o.frequency.setValueAtTime(freq, t0);
      if (slideTo) o.frequency.exponentialRampToValueAtTime(slideTo, t0 + dur);
      g.gain.setValueAtTime(0.0001, t0); g.gain.exponentialRampToValueAtTime(vol, t0 + 0.01); g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
      o.connect(g).connect(c.destination); o.start(t0); o.stop(t0 + dur + 0.02);
    }
    function noise(dur, vol = 0.3, when = 0, cutoff = 2000) {
      const c = ac(); if (!c) return;
      const len = Math.floor(c.sampleRate * dur), buf = c.createBuffer(1, len, c.sampleRate), d = buf.getChannelData(0);
      for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / len);
      const src = c.createBufferSource(), f = c.createBiquadFilter(), g = c.createGain(), t0 = c.currentTime + when;
      src.buffer = buf; f.type = 'lowpass'; f.frequency.value = cutoff; g.gain.value = vol;
      src.connect(f).connect(g).connect(c.destination); src.start(t0);
    }
    const guard = (fn) => (...a) => { if (on()) fn(...a); };
    return {
      unlock: () => { if (on()) ac(); },
      flip: guard(() => { const now = Date.now(); if (now - lastFlip < 90) return; lastFlip = now; noise(0.07, 0.35, 0, 3500); }),
      chip: guard(() => { tone(1900, 0.05, 'square', 0.06); tone(2600, 0.04, 'square', 0.05, 0.035); }),
      horn: guard(() => { [0, 0.42].forEach((w) => { tone(330, 0.36, 'sawtooth', 0.13, w); tone(415, 0.36, 'sawtooth', 0.1, w); }); }),
      tick: guard(() => tone(1100, 0.03, 'square', 0.07)),
      boom: guard(() => { noise(1.3, 0.7, 0, 700); tone(130, 1.1, 'sine', 0.5, 0, 30); }),
      gulp: guard(() => { tone(420, 0.09, 'sine', 0.18, 0, 220); tone(360, 0.09, 'sine', 0.18, 0.11, 190); }),
      win: guard(() => { [523, 659, 784, 1046].forEach((f, i) => tone(f, 0.16, 'triangle', 0.14, i * 0.09)); }),
      lose: guard(() => tone(320, 0.35, 'sawtooth', 0.1, 0, 140)),
      pass: guard(() => tone(600, 0.08, 'triangle', 0.1, 0, 900)),
    };
  })();

        <div class="row" style="margin-top:10px"><input id="wown" maxlength="120" placeholder="${t('ownPh')}" value="${esc(ui.wOwn || '')}"><button class="btn" id="wownbtn" style="flex:.45">${t('useOwn')}</button></div>`;
      else body += banner(esc(t('picking', { name: nameOf(w.turnId) })));
      body += hostSkipButton(w.turnId);
    } else {
      body += cardHtml(`<div class="say-q">${esc(mltText(w.q))}</div>${w.q && w.q.by ? `<div class="say-by">· ${esc(w.q.by)}</div>` : ''}`);
      if (w.stage === 'vote') {
        if (!w.myVote) body += `<div class="targets">${S.players.map((p) => `<button class="btn big" data-wvote="${p.id}">${esc(p.name)}${p.id === me ? ' ' + t('youTag') : ''}</button>`).join('')}</div>`;
        else body += banner(esc(t('votedFor', { name: nameOf(w.myVote) })));
        body += `<div class="dots">${S.players.map((p) => `<span class="dot-p ${w.voted.includes(p.id) ? 'on' : ''}">${esc(p.name.slice(0, 1).toUpperCase())}</span>`).join('')}</div>`;
        if (amHost() && w.voted.length < S.players.length) body += `<button class="btn ghost" id="skip">${t('skipWaiting')}</button>`;
      } else {
        const max = Math.max(1, ...Object.values(w.counts));
        const rows = S.players.filter((p) => w.counts[p.id]).sort((a, b) => w.counts[b.id] - w.counts[a.id]);
        body += `<div class="pull-result pop">${esc(t('mltDrinks', { names: w.top.map(nameOf).join(', '), amount: unit(S.settings.mltSips || 1) }))}</div>
          <div class="vote-bars">${rows.map((p) => `<div class="vote-bar ${w.top.includes(p.id) ? 'top' : ''}"><span>${esc(p.name)}</span><i style="width:${(100 * w.counts[p.id]) / max}%"></i><b>${w.counts[p.id]}</b></div>`).join('')}</div>`;
